<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D1D1B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>Schwelmer Kegeltreff</title>
<style>
:root{--gelb:#FFD400;--gelb2:#FFF3B0;--gelb3:#F2C500;--ink:#111827;--ink2:#374151;--muted:#5B6270;--linie:#E5E7EB;--linie2:#CBD0D8;--bg:#F3F4F6;--card:#fff;--input:#fff;--chip:#EEF0F3;--tapbg:#F1F3F6;--rot:#b3261e;--rotbg:#fdeceb;--gruen:#1e7b34;--gruenbg:#e6f4ea;--r:20px;--hdr:58px;
 --dark:#111827;--on-accent:#111827;--hbar:var(--gelb);--navbg:rgba(255,255,255,.97);--navtext:#5B6270;--navtext-on:#111827;--navon:var(--gelb);--navon-ink:var(--on-accent);--barc:#4B5563;--avtext:var(--gelb);
 --hero-accent:var(--gelb);--hero-accent-ink:var(--on-accent);--hero-bg:var(--dark);--slogan:var(--gelb);--glow:transparent;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--font-d:var(--font);color-scheme:light}
/* ===== Stil: Vereinsheim (hell, ruhig) ===== */
[data-stil=vereinsheim]{--font:'Plus Jakarta Sans',system-ui,sans-serif;--font-d:var(--font);--r:22px;--navon:var(--dark);--navon-ink:#fff;--navtext-on:var(--ink);--slogan:var(--ink)}
/* ===== Stil: Flutlicht (dunkel, sportlich) ===== */
[data-stil=flutlicht]{--bg:#0E0F12;--card:#17191E;--input:#121418;--ink:#F2F2F0;--ink2:#C9CCD1;--muted:#A3A7AF;--linie:#2A2E36;--linie2:#3A3F49;--chip:#23262D;--tapbg:#1F2228;
 --dark:#2A2E36;--hero-bg:#17191E;--rot:#FF8A80;--rotbg:#3A1E1E;--gruen:#6EE7A0;--gruenbg:#14301F;--barc:#7A808B;--navbg:rgba(23,25,30,.96);--navtext:#A3A7AF;--navtext-on:#F2F2F0;
 --gelb2:#3A3314;--glow:rgba(255,212,0,.35);--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--font-d:'Space Grotesk',system-ui,sans-serif;color-scheme:dark}
/* ===== Stil: Anzeigetafel (plakativ, große Zahlen) ===== */
[data-stil=anzeigetafel]{--bg:#ECECE7;--ink:#0A0A0A;--ink2:#2E2E2B;--muted:#4A4A45;--linie:#D4D4CC;--linie2:#9C9C94;--chip:#E2E2DA;--tapbg:#fff;--dark:#0A0A0A;--r:6px;--barc:#0A0A0A;
 --navbg:var(--dark);--navtext:#BDBDB6;--navtext-on:#fff;--font:'Barlow',system-ui,sans-serif;--font-d:'Barlow Condensed','Arial Narrow',sans-serif}
/* ===== Farbwelt Rot-Weiß (FC Bayern) ===== */
[data-farbe=rw]{--gelb:#DC052D;--gelb2:#FDE3E8;--gelb3:#B00425;--on-accent:#fff;--hbar:#0066B2;--avtext:#fff;--slogan:#fff}
[data-stil=vereinsheim][data-farbe=rw]{--dark:#0E2240;--navon:#DC052D;--slogan:#DC052D}
[data-stil=flutlicht][data-farbe=rw]{--gelb2:#3A1420;--gelb3:#FF4D6A;--glow:rgba(220,5,45,.45);--avtext:#FF8095}
[data-stil=anzeigetafel][data-farbe=rw]{--dark:#0E2240;--barc:#0E2240;--hbar:#DC052D}
[data-farbe=rw] .hero .seg .ja{background:#0066B2}
.slogan{font-weight:800;letter-spacing:.3px;color:var(--slogan)}
main.wide{max-width:1180px}
@media (min-width:760px){.abend-2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
 .abend-2 .col-r{position:sticky;top:calc(var(--hdr) + 14px);max-height:calc(100vh - var(--hdr) - 96px);overflow:auto;border-radius:var(--r)}}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:6;background:var(--dark);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;min-height:var(--hdr)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--hbar)}
header img{height:42px;background:none;padding:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
header .t{flex:1;min-width:0}header .t b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .t small{color:rgba(255,255,255,.72);font-size:12px}
header .hb{background:none;border:0;color:#fff;font-size:20px;padding:6px;border-radius:10px}
#sync{font-size:12px;color:var(--gelb);white-space:nowrap}
main{padding:16px 14px calc(100px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--navbg);backdrop-filter:blur(10px);border-top:1px solid var(--linie);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav .in{max-width:720px;margin:0 auto;display:flex}
nav button{flex:1;border:0;background:none;padding:2px 0;font-size:11.5px;color:var(--navtext);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button i{font-style:normal;font-size:20px;line-height:30px;width:52px;border-radius:99px;transition:background .15s}
nav button.on{color:var(--navtext-on);font-weight:700}nav button.on i{background:var(--navon);color:var(--navon-ink)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 0 0 1px var(--linie)}
.card.hero{background:var(--hero-bg);color:#fff;box-shadow:none}
.card.hero .muted{color:rgba(255,255,255,.72)}
h2{font-size:22px;margin:0 0 2px;line-height:1.2}h3{font-size:16px;margin:0 0 10px}
.sec{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 4px 8px}
.muted{color:var(--muted);font-size:14px}.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center}.row>.f{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.btn{border:0;background:var(--chip);border-radius:14px;padding:12px 14px;font-weight:600;cursor:pointer;min-height:46px}
.btn.p{background:var(--gelb);color:var(--on-accent)}.btn.d{background:var(--dark);color:#fff}.btn.w{width:100%}
.btn.s{min-height:36px;padding:7px 12px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.4}
.x{border:0;background:none;color:var(--rot);padding:6px 8px;font-size:16px;cursor:pointer}
input,select,textarea{font:inherit;width:100%;padding:12px;border:1px solid var(--linie);border-radius:12px;background:var(--input);color:var(--ink);min-height:46px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gelb3);border-color:transparent}
label{display:block;font-size:13px;color:var(--ink2);margin:10px 0 4px;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:0;border-radius:14px;padding:12px 4px;background:rgba(255,255,255,.1);color:#fff;font-weight:600;min-height:54px;cursor:pointer}
.seg button span{display:block;font-size:18px}
.seg .ja{background:#2e9e4d}.seg .vl{background:var(--gelb);color:var(--on-accent)}.seg .nein{background:#c4413a}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:0 0 auto;border:0;border-radius:99px;padding:9px 14px;background:var(--chip);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--dark);color:#fff}.chip.an{background:var(--gruenbg);color:var(--gruen)}
.hero .chip{background:rgba(255,255,255,.12);color:#fff}.hero .chip.on{background:var(--hero-accent);color:var(--hero-accent-ink)}
.hero .btn.p,.hero .seg .vl{background:var(--hero-accent);color:var(--hero-accent-ink)}
.dchip{flex:0 0 auto;border:0;border-radius:16px;padding:8px 12px;background:var(--card);box-shadow:0 0 0 1px var(--linie);text-align:center;cursor:pointer;min-width:74px}
.dchip b{display:block;font-size:15px}.dchip small{font-size:11px;color:var(--muted)}
.dchip.on{background:var(--dark);color:#fff;box-shadow:none}.dchip.on small{color:rgba(255,255,255,.72)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle;background:var(--linie2)}
.dot.ja{background:#2e9e4d}.dot.vl{background:var(--gelb3)}.dot.nein{background:#c4413a}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--chip)}
.pill.ja{background:var(--gruenbg);color:var(--gruen)}.pill.nein{background:var(--rotbg);color:var(--rot)}.pill.vl{background:var(--gelb2)}.pill.y{background:var(--gelb);color:var(--on-accent)}
.hero .pill{background:rgba(255,255,255,.14);color:#fff}
.av{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--dark);color:var(--avtext);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.av.s{width:30px;height:30px;font-size:12px}.av.ja{box-shadow:0 0 0 3px #2e9e4d}.av.vl{box-shadow:0 0 0 3px var(--gelb3)}.av.nein{opacity:.35}
ul.l{list-style:none;margin:0;padding:0}ul.l li{padding:10px 0;border-bottom:1px solid var(--linie);display:flex;gap:10px;align-items:center}
ul.l li:last-child{border-bottom:0}ul.l li .g{flex:1;min-width:0}
.menu li{cursor:pointer}.menu li .ic{font-size:22px;width:38px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.tap{padding:12px 6px;border-radius:16px;border:0;background:var(--tapbg);text-align:center;user-select:none;cursor:pointer;font-weight:600}
.tap b{display:block;font-size:28px;line-height:1.1}
.tap.minus{background:var(--rotbg)}.tap:active{transform:scale(.95);background:var(--gelb)}
.sticky{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top) + 3px);z-index:4;background:var(--bg);padding:8px 0;margin:-8px 0 4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;border-bottom:1px solid var(--linie);text-align:right}
th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--muted);font-weight:600}
tr.sum td{font-weight:800;border-top:2px solid var(--ink);border-bottom:0}
.big{font-size:34px;font-weight:800;letter-spacing:-.5px}
.rot{color:var(--rot)}.gruen{color:var(--gruen)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--dark);color:#fff;padding:11px 18px;border-radius:14px;z-index:30;max-width:90%;box-shadow:0 6px 24px rgba(0,0,0,.25);font-weight:600;font-size:14px}
.setup{max-width:420px;margin:24px auto;padding:0 16px;text-align:center}.setup img{width:150px;margin:10px 0}
.setup .card{text-align:left}
pre.order{white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:12px;font-size:14px;margin:8px 0}
details>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;justify-content:space-between}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"›";transform:rotate(90deg);font-size:22px;color:var(--muted);transition:transform .15s}
details[open]>summary::after{transform:rotate(270deg)}
.cat{margin:12px 0 4px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
.dish{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--linie);cursor:pointer;align-items:flex-start}
.dish .nr{min-width:38px;font-weight:800;background:var(--gelb2);border-radius:8px;text-align:center;padding:2px 0}.dish .pr{white-space:nowrap;font-weight:700}
.banner{background:var(--gelb2);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.drv{border-radius:16px;background:var(--tapbg);padding:12px;margin-bottom:8px}
.seats{display:flex;gap:4px;margin:6px 0}.seats span{width:22px;height:22px;border-radius:6px;background:var(--card);box-shadow:0 0 0 1px var(--linie);font-size:12px;display:flex;align-items:center;justify-content:center}
.seats span.b{background:var(--dark);color:var(--avtext)}
.stepper{display:flex;align-items:center;gap:10px}.stepper button{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;cursor:pointer}
.stepper b{min-width:22px;text-align:center;font-size:18px}
#sheet .bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
#sheet .sh{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;max-width:720px;margin:0 auto;animation:up .18s ease-out}
#sheet .grip{width:40px;height:5px;border-radius:9px;background:#d8d5cb;margin:0 auto 10px}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sec.fold{cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}.sec.fold::after{content:'▾';font-size:14px;color:var(--muted)}.sec.zu::after{content:'▸'}.sec.zu{margin-bottom:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:16px;padding:12px;box-shadow:0 0 0 1px var(--linie)}
.tile .k{font-size:12px;color:var(--muted);font-weight:600}.tile .v{font-size:18px;font-weight:800;margin-top:2px}.tile .s{font-size:12px;color:var(--ink2)}
.bars .br{display:grid;grid-template-columns:26px 82px 1fr 58px;gap:6px;align-items:center;padding:4px 0;font-size:14px}
.bars .rk{color:var(--muted);font-size:12px;text-align:right}.bars .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bars .tr{height:18px;display:flex;align-items:center}.bars .bar{height:14px;border-radius:0 4px 4px 0;background:var(--barc);min-width:2px}
.bars .me .bar{background:var(--gelb3)}.bars .me .nm{color:var(--ink)}
.bars .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.cols{display:flex;align-items:flex-end;gap:3px;height:140px;border-bottom:1px solid var(--linie2);padding-top:6px}
.cols button{flex:1;border:0;background:none;padding:0;height:100%;display:flex;align-items:flex-end;cursor:pointer}
.cols button i{display:block;width:100%;background:var(--barc);border-radius:4px 4px 0 0;min-height:2px}
.cols button.on i{background:var(--gelb3)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}

.kopf2{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}.kopf2 .kopfsel,.kopf2>.card{margin:0;width:100%}
.chips.anw{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.chips.anw .chip{text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chips.anw .chip.gast{grid-column:span 2}
.sitzk summary{gap:8px}.sitzk .sk{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:14px}
.sitzk .hero{margin:0}.pill.warn{background:var(--gelb);color:#1a1a1a;border-radius:99px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.katnav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px;padding:2px}.katnav::-webkit-scrollbar{display:none}
.kat{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:0;border-radius:14px;padding:8px 12px;background:var(--chip);color:inherit;font-weight:700;font-size:14px;text-align:left;cursor:pointer;line-height:1.15}
.kat i{font-style:normal;font-size:20px}.kat small{display:block;font-weight:500;font-size:11px;opacity:.7}
.kat.on{background:var(--dark);color:#fff;box-shadow:0 0 0 2px var(--gelb)}
@media (min-width:640px){
 .erf{display:grid;grid-template-columns:250px minmax(0,1fr);gap:12px;align-items:start}
 .katnav{display:grid;grid-template-columns:1fr 1fr;overflow:visible;margin:0;position:sticky;top:calc(var(--hdr) + 10px)}
 .kat{padding:8px 9px;min-height:48px}
 .erf-main{margin-bottom:12px}}
@media (min-width:1000px){.erf{grid-template-columns:300px minmax(0,1fr)}.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}}

/* ---------- Stil-Details ---------- */
h2,h3,.big,header .t b,.tile .v,.tap b{font-family:var(--font-d)}
[data-stil=vereinsheim] header{background:var(--bg);color:var(--ink)}
[data-stil=vereinsheim] header::after{display:none}
[data-stil=vereinsheim] header img{background:var(--dark);border-radius:12px;padding:5px 9px;height:44px;filter:none}
[data-stil=vereinsheim] header .t small,[data-stil=vereinsheim] #sync{color:var(--muted)}
[data-stil=vereinsheim] header .hb{color:var(--ink)}
[data-stil=vereinsheim] h2{letter-spacing:-.02em;font-weight:800}
[data-stil=vereinsheim] .card{box-shadow:none}
[data-stil=vereinsheim] .tap{background:var(--tapbg)}
[data-stil=vereinsheim] nav,[data-stil=flutlicht] nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;border-radius:24px;border:0;padding:6px 4px;box-shadow:0 10px 30px -12px rgba(17,24,39,.35)}
[data-stil=flutlicht] nav{box-shadow:0 0 0 1px var(--linie),0 10px 30px -12px rgba(0,0,0,.6)}
[data-stil=vereinsheim] main,[data-stil=flutlicht] main{padding-bottom:calc(112px + env(safe-area-inset-bottom))}
[data-stil=flutlicht] header{background:var(--bg);border-bottom:1px solid var(--linie)}
[data-stil=flutlicht] header::after{display:none}
[data-stil=flutlicht] .card{box-shadow:0 0 0 1px var(--linie)}
[data-stil=flutlicht] .card.hero{box-shadow:0 0 0 1px var(--linie),0 22px 50px -24px var(--glow)}
[data-stil=flutlicht] .tap{box-shadow:0 0 0 1px var(--linie)}
[data-stil=flutlicht] .tap:active{background:var(--gelb);color:var(--on-accent)}
[data-stil=flutlicht] .kat.on,[data-stil=anzeigetafel] .kat.on{background:var(--gelb);color:var(--on-accent);box-shadow:none}
[data-stil=flutlicht] #sheet .grip{background:#3A3F49}
[data-stil=anzeigetafel] h2,[data-stil=anzeigetafel] h3,[data-stil=anzeigetafel] header .t b,[data-stil=anzeigetafel] .sec,[data-stil=anzeigetafel] nav button,[data-stil=anzeigetafel] .btn,[data-stil=anzeigetafel] .kat span,[data-stil=anzeigetafel] details>summary{font-family:var(--font-d);text-transform:uppercase;letter-spacing:.04em}
[data-stil=anzeigetafel] h2{font-size:28px}[data-stil=anzeigetafel] h3{font-size:19px}[data-stil=anzeigetafel] header .t b{font-size:21px}
[data-stil=anzeigetafel] .btn{font-weight:800;font-size:17px}
[data-stil=anzeigetafel] .card{box-shadow:0 0 0 2px var(--ink)}
[data-stil=anzeigetafel] .card.hero{box-shadow:none}
[data-stil=anzeigetafel] .tap{box-shadow:0 0 0 2px var(--ink);background:#fff}
[data-stil=anzeigetafel] .tap b{font-size:46px;line-height:1}
[data-stil=anzeigetafel] .tap:active{background:var(--gelb);color:var(--on-accent)}
[data-stil=anzeigetafel] .btn,[data-stil=anzeigetafel] .chip,[data-stil=anzeigetafel] .kat,[data-stil=anzeigetafel] input,[data-stil=anzeigetafel] select,[data-stil=anzeigetafel] textarea,[data-stil=anzeigetafel] .tile,[data-stil=anzeigetafel] .pill{border-radius:4px}
[data-stil=anzeigetafel] input,[data-stil=anzeigetafel] select,[data-stil=anzeigetafel] textarea{border:2px solid var(--ink)}
[data-stil=anzeigetafel] .tile{box-shadow:0 0 0 2px var(--ink)}[data-stil=anzeigetafel] .tile .v{font-size:24px}
[data-stil=anzeigetafel] .big{font-size:44px}

<body>
<div id="app"></div>
<script>
'use strict';
/* =========================================================
   Schwelmer Kegeltreff – Vereins-App
   Code: öffentliches Repo „App“ (GitHub Pages) · Daten: privates Repo „App-Daten“ (data/*.json)
   ========================================================= */
const APP_VERSION='1.0.2';
const OWNER='Schwelmer-Kegeltreff-2016', REPO='App-Daten', BRANCH='main';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const eur=n=>r2(n).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const fmtN=(n,d=1)=>(+n||0).toLocaleString('de-DE',{maximumFractionDigits:d,minimumFractionDigits:0});
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isNaN(n)?0:n};
const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const fmtD=(iso,o={weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})=>new Date(iso+'T12:00:00').toLocaleDateString('de-DE',o);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clone=o=>JSON.parse(JSON.stringify(o));
const ini=n=>String(n||'?').replace(/[^A-Za-zÄÖÜäöü]/g,'').slice(0,2).toUpperCase();
function toast(msg,ms=2400){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
function vib(){try{navigator.vibrate&&navigator.vibrate(12)}catch(_){}}
function sheet(html){closeSheet();const d=document.createElement('div');d.id='sheet';d.innerHTML=`<div class="bg" onclick="closeSheet()"></div><div class="sh"><div class="grip"></div>${html}</div>`;document.body.appendChild(d)}
function closeSheet(){$('#sheet')?.remove()}
function ask(text,okLabel,fn,danger){window._askFn=fn;sheet(`<h3>${esc(text)}</h3><div class="row" style="margin-top:14px"><button class="btn f" onclick="closeSheet()">Abbrechen</button><button class="btn f ${danger?'d':'p'}" onclick="closeSheet();window._askFn()">${esc(okLabel)}</button></div>`)}

const DEFAULT_STRAFEN=[
 {id:'pudel',name:'Pudel',betrag:.10,art:'selbst'},
 {id:'glocke',name:'Glöckchen',betrag:.10,art:'selbst'},
 {id:'neun',name:'Alle Neune',betrag:.50,art:'andere'},
 {id:'kranz',name:'Kranz',betrag:1,art:'andere'},
 {id:'figur',name:'Figur vergessen',betrag:1,art:'selbst',schnapsJedesMal:3},
 {id:'rauchen',name:'Einsatz verpasst (Rauchen)',betrag:1,art:'selbst'},
 {id:'team',name:'Teamspiel verloren',betrag:1,art:'selbst'}];
const ANREISE={selbst:['🚗','Ich fahre'],mitfahrt:['🙋','Fahre mit'],oepnv:['🚌','Bus & Bahn'],taxi:['🚕','Taxi'],fuss:['🚶','Zu Fuß / Rad']};
const ZST={ja:'Dabei',vl:'Unsicher',nein:'Nicht dabei'};

/* ---------------- Speicher: GitHub (privates Repo) oder Demo (Browser) ---------------- */
const B64={enc:s=>btoa(unescape(encodeURIComponent(s))),dec:s=>decodeURIComponent(escape(atob(s.replace(/\s/g,''))))};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(_){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(_){}};
const Store={
 cfg:(()=>{const c=JSON.parse(lsGet('kt_cfg')||'null');return c?(c.mode==='demo'?c:{mode:'github',token:c.token}):null})(),
 isDemo(){return this.cfg?.mode==='demo'},
 url(p){return `https://api.github.com/repos/${OWNER}/${REPO}/contents/data/${p}`},
 hdr(){return{Authorization:'Bearer '+this.cfg.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}},
 /* get: Netz → Cache aktualisieren; ohne Netz → letzter Stand aus dem Cache. Offene Änderungen der Warteschlange werden darübergelegt. */
 async get(path){let r;
  try{r=await this.fetch(path);if(!this.isDemo())lsSet('kt_cache:'+path,JSON.stringify(r.data));netz(true)}
  catch(e){if(!e.offline)throw e;netz(false);const c=lsGet('kt_cache:'+path);if(c===null)throw new Error('Offline – diese Daten wurden auf dem Gerät noch nie geladen');r={data:JSON.parse(c),sha:null,cached:true}}
  return{...r,data:overlay(path,r.data)}},
 async fetch(path){
  if(this.isDemo()){if(window._offlineTest)throw offErr();const v=lsGet('kt_demo:'+path);return{data:v?JSON.parse(v):null,sha:null}}
  let r;try{r=await fetch(this.url(path)+`?ref=${BRANCH}&_=${Date.now()}`,{headers:this.hdr(),cache:'no-store'})}catch(_){throw offErr()}
  if(r.status===404)return{data:null,sha:null};
  if(!r.ok)throw await apiErr(r);
  const j=await r.json();
  if(!j.content&&j.download_url){const raw=await fetch(j.git_url,{headers:this.hdr()});const b=await raw.json();return{data:JSON.parse(B64.dec(b.content)),sha:j.sha}}
  return{data:JSON.parse(B64.dec(j.content)),sha:j.sha};
 },
 async put(path,data,sha,msg){
  if(this.isDemo()){if(window._offlineTest)throw offErr();lsSet('kt_demo:'+path,JSON.stringify(data));return 'demo'}
  const body={message:msg||('Update '+path),content:B64.enc(JSON.stringify(data,null,1)),branch:BRANCH};
  if(sha)body.sha=sha;
  let r;try{r=await fetch(this.url(path),{method:'PUT',headers:{...this.hdr(),'Content-Type':'application/json'},body:JSON.stringify(body)})}catch(_){throw offErr()}
  lsSet('kt_cache:'+path,JSON.stringify(data));
  if(!r.ok)throw await apiErr(r);
  return (await r.json()).content.sha;
 },
 async del(path,msg){
  if(this.isDemo()){lsDel('kt_demo:'+path);return}
  const {sha}=await this.fetch(path);if(!sha)return;
  const r=await fetch(this.url(path),{method:'DELETE',headers:{...this.hdr(),'Content-Type':'application/json'},body:JSON.stringify({message:msg||('Lösche '+path),sha,branch:BRANCH})});
  if(!r.ok&&r.status!==404)throw await apiErr(r);
 },
 async mutate(path,fn,msg,def){
  for(let i=0;i<5;i++){
   const {data,sha}=await this.fetch(path);
   const nd=fn(data??clone(def??{}));
   try{await this.put(path,nd,sha,msg);return nd}
   catch(e){if(e.status===409||e.status===422){await sleep(300*(i+1));continue}throw e}
  }
  throw new Error('Gleichzeitige Änderung – bitte nochmal versuchen');
 }
};
async function apiErr(r){let m='';try{m=(await r.json()).message}catch(_){}
 const e=new Error(r.status===401?'Zugangsschlüssel ungültig oder abgelaufen':r.status===403?'Keine Berechtigung: '+m:r.status===404?'Daten-Repository nicht gefunden – passt der Zugangsschlüssel?':('GitHub-Fehler '+r.status+': '+m));e.status=r.status;return e}
function setSync(t){const s=$('#sync');if(s)s.textContent=t}
/* ---------- Offline-Warteschlange ----------
   Änderungen (Zusagen, Bestellungen, Spiele, Sitzordnung) wirken sofort auf dem Gerät, werden dauerhaft im Gerät
   gemerkt und gesammelt hochgeladen: 4 s nach dem letzten Tipp, beim Reiterwechsel, beim Verlassen der App
   und automatisch, sobald wieder Netz da ist. */
const offErr=()=>{const e=new Error('Keine Internetverbindung');e.offline=true;return e};
const OUT={list:(()=>{try{return JSON.parse(lsGet('kt_outbox')||'[]')}catch(_){return[]}})(),timer:null,busy:null};
const OPS={
 zusage:(d,o)=>{const t=d.termine?.find(x=>x.id===o.tid);if(!t)return;t.zusagen=t.zusagen||{};const z={...(t.zusagen[o.who]||{}),...o.patch,ts:o.ts,von:o.von};
  if(z.status==='nein'){z.anreise='';z.mitBei='';z.plaetze=0}if(z.anreise!=='mitfahrt')z.mitBei='';t.zusagen[o.who]=z;
  if(z.status==='nein'||z.anreise!=='selbst')for(const k in t.zusagen)if(t.zusagen[k].mitBei===o.who)t.zusagen[k].mitBei=''},
 zusageDel:(d,o)=>{const t=d.termine?.find(x=>x.id===o.tid);if(!t?.zusagen)return;delete t.zusagen[o.who];for(const k in t.zusagen)if(t.zusagen[k].mitBei===o.who)t.zusagen[k].mitBei=''},
 bestAdd:(d,o)=>{d.positionen=d.positionen||[];if(!d.positionen.some(p=>p.id===o.pos.id))d.positionen.push(o.pos)},
 bestDel:(d,o)=>{d.positionen=(d.positionen||[]).filter(p=>p.id!==o.id)},
 bhAdd:(d,o)=>{d.personen=d.personen||{};const l=d.personen[o.pid]=d.personen[o.pid]||[];if(!l.some(e=>e.pos===o.e.pos))l.push(o.e);d.personen[o.pid]=l.slice(-40)},
 bhDel:(d,o)=>{for(const k in d.personen||{})d.personen[k]=d.personen[k].filter(e=>e.pos!==o.pos)},
 spielAdd:(d,o)=>{d.spiele=d.spiele||[];if(!d.spiele.some(g=>g.id===o.g.id))d.spiele.push(o.g)},
 spielDel:(d,o)=>{d.spiele=(d.spiele||[]).filter(g=>g.id!==o.id)},
 sitz:(d,o)=>{d.spiele=d.spiele||[];if(!d.sitz)d.sitz=o.sitz},
 nachz:(d,o)=>{const z=d.sitz;if(!z||z.tafel.some(q=>q.id===o.id)||z.tuer.some(q=>q.id===o.id))return;const k=z.tafel.length<z.tuer.length?'tafel':z.tuer.length<z.tafel.length?'tuer':o.seite;z[k].push({id:o.id,name:o.name})}};
const defFor=p=>p.startsWith('bestellungen/')?{positionen:[]}:p.startsWith('spiele/')?{spiele:[]}:p==='bestellhistorie.json'?{personen:{}}:p==='termine.json'?{termine:[]}:{};
function overlay(path,data){const ops=OUT.list.filter(x=>x.path===path);if(!ops.length)return data;const d=clone(data??defFor(path));ops.forEach(x=>{try{OPS[x.op.t](d,x.op)}catch(_){}});return d}
function lokal(path){if(path==='termine.json')return S.termine;if(path==='bestellhistorie.json')return S.bh;
 if(path.startsWith('bestellungen/'))return S.bestFor===path.slice(13,-5)?S.best:null;
 if(path.startsWith('spiele/')){const tid=path.slice(7,-5);return S.spielCache[tid]=S.spielCache[tid]||{spiele:[]}}return null}
function setLokal(path,d){if(path==='termine.json')S.termine=d;else if(path==='bestellhistorie.json')S.bh=d;else if(path.startsWith('bestellungen/')){if(S.bestFor===path.slice(13,-5))S.best=d}else if(path.startsWith('spiele/'))S.spielCache[path.slice(7,-5)]=d}
function enqueue(path,op,msg,delay=4000){OUT.list.push({id:'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),path,op,msg});lsSet('kt_outbox',JSON.stringify(OUT.list));
 const l=lokal(path);if(l)OPS[op.t](l,op);syncAnzeige();clearTimeout(OUT.timer);OUT.timer=setTimeout(flushOutbox,delay)}
async function flushOutbox(){clearTimeout(OUT.timer);OUT.timer=null;if(OUT.busy)return OUT.busy;if(!OUT.list.length)return;
 OUT.busy=(async()=>{let fehler=false;setSync('⏳');
  for(const path of [...new Set(OUT.list.map(x=>x.path))]){const items=OUT.list.filter(x=>x.path===path);if(!items.length)continue;
   try{const d=await Store.mutate(path,d=>{items.forEach(x=>{try{OPS[x.op.t](d,x.op)}catch(_){}});return d},`${meName()}: ${items.length>1?items.length+' Änderungen – ':''}${items.slice(-3).map(x=>x.msg).join(' · ')}`,defFor(path));
    const ids=new Set(items.map(x=>x.id));OUT.list=OUT.list.filter(x=>!ids.has(x.id));lsSet('kt_outbox',JSON.stringify(OUT.list));setLokal(path,overlay(path,d));netz(true)}
   catch(e){fehler=true;if(e.offline)netz(false);else toast('⚠ '+e.message,5000);break}}
  if(fehler)OUT.timer=setTimeout(flushOutbox,20000);
  syncAnzeige();const ae=document.activeElement;if(!fehler&&!$('#sheet')&&!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)))rerender()})().finally(()=>{OUT.busy=null});
 return OUT.busy}
const flushTermine=flushOutbox;
function netz(an){if(S.offline===!an)return;S.offline=!an;syncAnzeige();if(an){if(OUT.list.length)flushOutbox();if(lsGet('kt_abend_dirty')&&!saveTimer)speichereAbend()}}
function syncAnzeige(){const n=OUT.list.length+(lsGet('kt_abend_dirty')?1:0),el=$('#sync');if(!el)return;
 el.textContent=S.offline?`📴 Offline${n?' · '+n+' wartet':''}`:n?`● ${n} wartet`:'';el.title=S.offline?'Keine Verbindung – alles bleibt auf diesem Gerät gespeichert und wird später hochgeladen. Tippen zum erneuten Versuch.':''}
window.addEventListener('online',()=>netz(true));window.addEventListener('offline',()=>netz(false));
setInterval(()=>{if((OUT.list.length||lsGet('kt_abend_dirty'))&&!OUT.busy&&navigator.onLine){flushOutbox();if(lsGet('kt_abend_dirty')&&!saveTimer)speichereAbend()}},30000);
async function save(path,fn,msg,def){
 if(OUT.list.some(x=>x.path===path)||OUT.busy)await flushOutbox();
 if(S.offline&&!Store.isDemo()&&!navigator.onLine){toast('📴 Dafür braucht es kurz Internet',4000);throw offErr()}
 setSync('⏳');
 try{const d=await Store.mutate(path,fn,`${meName()}: ${msg}`,def);setSync('✓');setTimeout(()=>setSync(''),1500);return d}
 catch(e){setSync('⚠');toast('⚠ '+e.message,5000);throw e}
}

/* ---------------- Zustand ---------------- */
const S={verein:null,termine:null,kasse:null,karte:null,hist:null,me:lsGet('kt_me'),tab:lsGet('kt_tab')||'start',sub:null,
 selT:null,abend:null,abendSha:null,abendFor:null,kat:'pudel',minus:false,best:null,bestFor:null,ef:{},kOpen:null,
 st:{zeit:null,metrik:'pudel',modus:'avg',spieler:null,vSel:null},loadedAt:0,kontakte:{personen:{}},spielCache:{},sp:null,rec:null,spFilter:'alle',spOpen:null};
const M=id=>S.verein?.mitglieder.find(m=>m.id===id);
const nameOf=id=>M(id)?.spitzname||S.hist?.namen?.[id]||id;
const meName=()=>Store.isDemo()?'Demo':(M(S.me)?.spitzname||'?');
const aktive=()=>(S.verein?.mitglieder||[]).filter(m=>m.aktiv).sort((a,b)=>a.spitzname.localeCompare(b.spitzname,'de'));
const hasRole=r=>(M(S.me)?.rollen||[]).includes(r);
/* ---------- Admin-Bereich ----------
   Admin ist, wer auf diesem Gerät das Admin-Passwort eingegeben hat (nicht mehr über die Person).
   In verein.json liegt nur ein PBKDF2-Prüfwert. Nach 30 Minuten ohne Tippen sperrt sich der Bereich. */
const ADMIN_MIN=30;
const adminCfg=()=>S.verein?.admin;
const adminOffen=()=>!!adminCfg()&&+(lsGet('kt_admin_bis')||0)>Date.now();
const isAdmin=()=>adminOffen();
const isKasse=()=>adminOffen();
const darfEinrichten=()=>!adminCfg()&&(hasRole('admin')||Store.isDemo());
let ADMIN_WAR=false;
async function pwHash(pw,saltB64,iter){const salt=Uint8Array.from(atob(saltB64),c=>c.charCodeAt(0));
 const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:iter},key,256);
 return btoa(String.fromCharCode(...new Uint8Array(bits)))}
function adminAuf(){lsSet('kt_admin_bis',String(Date.now()+ADMIN_MIN*60000));ADMIN_WAR=true}
document.addEventListener('pointerdown',()=>{if(adminOffen())adminAuf()},true);
setInterval(()=>{if(ADMIN_WAR&&!adminOffen()){ADMIN_WAR=false;lsDel('kt_admin_bis');if(S.verein&&$('#app header')){closeSheet();shell();rerender();toast('🔒 Admin-Bereich automatisch gesperrt',4000)}}},15000);
const strafen=()=>S.verein?.strafen||DEFAULT_STRAFEN;
const termineSorted=()=>[...(S.termine?.termine||[])].sort((a,b)=>a.datum.localeCompare(b.datum));
const T=id=>S.termine?.termine.find(t=>t.id===id);
const isKegeln=t=>(t?.art||'kegeln')==='kegeln';
const emo=t=>t?.emoji||(isKegeln(t)?'🎳':'📌');
const titelOf=t=>t?.titel||(isKegeln(t)?'Kegelabend':'Termin');
const kegelTermine=()=>termineSorted().filter(isKegeln);
function naechsterTermin(){const h=todayISO();return kegelTermine().find(t=>t.status==='geplant'&&t.datum>=h)||kegelTermine().filter(t=>t.status==='geplant').pop()}
function naechsterSonder(){const h=todayISO();return termineSorted().find(t=>!isKegeln(t)&&t.status!=='abgesagt'&&t.datum>=h)}
function abendTermin(){const h=todayISO();const ts=kegelTermine();
 return ts.find(t=>t.datum===h&&t.status!=='ausgefallen')||ts.filter(t=>t.status==='geplant'&&t.datum<h).pop()||naechsterTermin()}

async function loadAll(){
 const [v,t,k,kt]=await Promise.all([Store.get('verein.json'),Store.get('termine.json'),Store.get('kasse.json'),Store.get('kontakte.json')]);
 S.kontakte=kt.data||{personen:{}};S.kontakte.personen=S.kontakte.personen||{};
 if(!v.data)throw new Error('data/verein.json fehlt im Daten-Repository');
 S.verein=v.data;S.verein.strafen=S.verein.strafen||DEFAULT_STRAFEN;
 S.termine=t.data||{termine:[]};S.kasse=k.data||{buchungen:[]};S.loadedAt=Date.now();
}
async function loadKarte(force){if(S.karte&&!force)return;S.karte=(await Store.get('speisekarte.json')).data||{gerichte:[]}}
async function loadHist(force){if(S.hist&&!force)return;S.hist=(await Store.get('historie.json')).data||{abende:[],pokale:[],rekorde:null,legacy:null,namen:{}}}

/* ---------------- Berechnungen ---------------- */
function berechneAbend(abend,verein){
 const st=verein.strafen||DEFAULT_STRAFEN,pres=abend.spieler.filter(p=>p.anwesend),tot={},res={},auto=spieleAuto(abend.id,verein);
 st.forEach(s=>tot[s.id]=pres.reduce((a,p)=>a+(p.counts?.[s.id]||0),0));
 for(const p of pres){let s=0;
  for(const x of st){const own=p.counts?.[x.id]||0;s+=x.art==='andere'?(tot[x.id]-own)*x.betrag:own*x.betrag}
  s+=num(p.spiele)+(auto[p.id]||0);res[p.id]={strafe:r2(s),spieleAuto:r2(auto[p.id]||0)}}
 const max=Math.max(0,...pres.filter(p=>!p.gast).map(p=>res[p.id].strafe));
 const R=abend.rechnung||{},n=pres.length||1,pids=new Set(pres.map(p=>p.id));
 const ex=(R.extras||[]).filter(e=>pids.has(e.pid)&&num(e.betrag)>0),exSum=ex.reduce((a,e)=>a+num(e.betrag),0);
 const gesamt=num(R.gesamt??R.getraenke),anteil=(Math.max(0,gesamt-exSum)+num(R.trinkgeld))/n;
 for(const p of abend.spieler){

const icsEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
function icsFold(line){const enc=new TextEncoder(),out=[];let cur='',len=0;for(const ch of line){const b=enc.encode(ch).length;if(len+b>73){out.push(cur);cur=' ';len=1}cur+=ch;len+=b}out.push(cur);return out.join('\r\n')}
function icsKalender(termine){const now=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Schwelmer Kegeltreff//App//DE','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Schwelmer Kegeltreff',

  'BEGIN:STANDARD','TZOFFSETFROM:+0200','TZOFFSETTO:+0100','TZNAME:CET','DTSTART:19701025T030000','RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU','END:STANDARD','END:VTIMEZONE'];
 for(const t of termine){const d=t.datum.replace(/-/g,''),[hh,mm]=(t.uhrzeit||(isKegeln(t)?'18:00':'19:00')).split(':'),eh=String(Math.min(23,+hh+5)).padStart(2,'0');
  L.push('BEGIN:VEVENT',`UID:kegeltreff-${t.id}@schwelmer-kegeltreff`,`DTSTAMP:${now}`,`DTSTART;TZID=Europe/Berlin:${d}T${hh}${mm}00`,`DTEND;TZID=Europe/Berlin:${d}T${eh}${mm}00`,
   `SUMMARY:${icsEsc((t.status==='ausgefallen'||t.status==='abgesagt'?'Fällt aus: ':'')+(isKegeln(t)?emo(t)+' Kegeln – Schwelmer Kegeltreff':emo(t)+' '+titelOf(t)+' (Kegeltreff)'))}`,`LOCATION:${icsEsc(isKegeln(t)?(S.verein.ort||'Restaurant Samos, Dahler Str. 2, 42389 Wuppertal'):(t.ort||''))}`,
   `DESCRIPTION:${icsEsc((t.bemerkung?t.bemerkung+'\n':'')+'Zu- und Absage in der App: '+APP_URL())}`,`URL:${APP_URL()}`,`STATUS:${t.status==='ausgefallen'||t.status==='abgesagt'?'CANCELLED':'CONFIRMED'}`);
  if(t.status!=='ausgefallen'&&t.status!=='abgesagt')L.push('BEGIN:VALARM','ACTION:DISPLAY',isKegeln(t)?'DESCRIPTION:Morgen ist Kegeln – Figur nicht vergessen!':'DESCRIPTION:Morgen: '+icsEsc(titelOf(t)),'TRIGGER:-P1D','END:VALARM');
  L.push('END:VEVENT')}
 L.push('END:VCALENDAR');return L.map(icsFold).join('\r\n')+'\r\n'}

function aggregate(ab){const r={};const P=pid=>r[pid]??={pid,abende:0,zA:0,pudel:0,glocke:0,neun:0,kranz:0,figur:0,spiele:0,strafe:0,strafeN:0,best:{}};
 const jahre=new Set();
 for(const a of ab){
  for(const[pid,v]of Object.entries(a.spieler)){const x=P(pid);x.abende++;
   if(a.ohneWerte){jahre.add(a.datum.slice(0,4));continue}
   x.zA++;for(const k of CNT){x[k]+=+v[k]||0;if((+v[k]||0)>(x.best[k]?.wert||0))x.best[k]={wert:+v[k],datum:a.datum}}}
  for(const[pid,s]of Object.entries(a.strafen||{})){if(s<=0)continue;const x=P(pid);x.strafe+=s;x.strafeN++;if(s>(x.best.strafe?.wert||0))x.best.strafe={wert:s,datum:a.datum}}
  if(!a.strafen)for(const[pid,v]of Object.entries(a.spieler))if(v.strafe!=null){const x=P(pid);x.strafe+=v.strafe;x.strafeN++}}
 for(const y of jahre)for(const[pid,v]of Object.entries(S.hist?.jahreswerte?.[y]||{})){const x=P(pid);x.zA+=v.abende;for(const k of['pudel','glocke','neun','kranz'])x[k]+=v[k]||0}
 return r}
const metricVal=(x,k,modus)=>k==='abende'?x.abende:k==='strafe'?(x.strafeN?(modus==='avg'?x.strafe/x.strafeN:x.strafe):null):(modus==='avg'?(x.zA?x[k]/x.zA:null):(x.zA?x[k]:null));
function pokaleFuer(ab){const g=Object.values(aggregate(ab)),N=ab.length,mn=N>=4?2:1,erst=ab[0]?.datum,letzt=ab[ab.length-1]?.datum;
 const pool=g.filter(q=>q.zA>=mn),avg=(k,dir)=>pool.filter(q=>q.zA).sort((a,b)=>dir*(b[k]/b.zA-a[k]/a.zA))[0]?.pid;
 const voll=g.filter(q=>q.strafeN&&eintrittOf(q.pid)<=erst&&!(austrittOf(q.pid)&&austrittOf(q.pid)<letzt)).sort((a,b)=>a.strafe-b.strafe);
 return{pudelkoenig:avg('pudel',-1),pudeltrottel:avg('pudel',1),glocke:avg('glocke',1),neun:avg('neun',1),kranz:avg('kranz',1),platz1:voll[0]?.pid,platz2:voll[1]?.pid,platz3:voll[2]?.pid}}

const THEMES={auto:{name:'Automatisch',ic:'📱',sub:'wie das Handy'},light:{name:'Hell',ic:'☀️',sub:'Kegeltreff-Gelb'},dark:{name:'Dunkel',ic:'🌙',sub:'schont die Augen'},
 bvb:{name:'Schwarz-Gelb',ic:'🖤💛',sub:'Dortmund-Modus',motto:'Echte Liebe',farbe:'#FDE100',sprueche:['Echte Liebe 🖤💛','Heja BVB!','Schwarz-Gelb bis in die letzte Gasse','Hier wackelt nicht nur der Kranz – hier bebt die Wand','Pudel? Nicht mit Borussia!','Alle Neune für Schwarz-Gelb']},
 fcb:{name:'Rot-Weiß',ic:'❤️🤍',sub:'Bayern-Modus',motto:'Mir san mir',farbe:'#fff',sprueche:['Mir san mir ❤️🤍','Rot-Weiß kegelt besser','Ein Kranz für den Rekordmeister','Pudel gibt’s nur in Giesing','Gewinnen ist bei uns Pflicht','Mia san da – und treffen alle Neune']}};
/* ---------- Darstellung: Stil × Farbwelt (pro Gerät) ---------- */
const STILE={auto:{name:'Automatisch',sub:'hell oder dunkel wie das Handy'},vereinsheim:{name:'Vereinsheim',sub:'hell & ruhig'},flutlicht:{name:'Flutlicht',sub:'dunkel & sportlich'},anzeigetafel:{name:'Anzeigetafel',sub:'groß & plakativ'}};
const FARBEN={sg:{name:'Vereinsfarben',sub:'Schwarz-Gelb'},bvb:{name:'Schwarz-Gelb',sub:'mit BVB-Sprüchen'},rw:{name:'Rot-Weiß',sub:'mit Bayern-Sprüchen'}};
const SCHRIFT={vereinsheim:'Plus+Jakarta+Sans:wght@400;600;700;800',flutlicht:'Space+Grotesk:wght@500;700',anzeigetafel:'Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700;800'};
(()=>{const alt=lsGet('kt_theme');if(alt&&!lsGet('kt_stil')){const m={light:['vereinsheim','sg'],dark:['flutlicht','sg'],bvb:['vereinsheim','bvb'],fcb:['vereinsheim','rw'],auto:['auto','sg']}[alt]||['auto','sg'];lsSet('kt_stil',m[0]);lsSet('kt_farbe',m[1])}})();
const stilWahl=()=>STILE[lsGet('kt_stil')]?lsGet('kt_stil'):'auto';
const stilAktiv=()=>{const t=stilWahl();return t==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'flutlicht':'vereinsheim'):t};
const farbeWahl=()=>FARBEN[lsGet('kt_farbe')]?lsGet('kt_farbe'):'sg';
const themeWahl=stilWahl;
const themeAktiv=()=>({bvb:'bvb',rw:'fcb'})[farbeWahl()]||'light';
function applyTheme(){const st=stilAktiv(),fa=farbeWahl(),de=document.documentElement;de.dataset.stil=st;de.dataset.farbe=fa==='rw'?'rw':'sg';delete de.dataset.theme;
 let l=document.getElementById('kt-font');if(!l){l=document.createElement('link');l.id='kt-font';l.rel='stylesheet';document.head.appendChild(l)}
 const href=SCHRIFT[st]?'https://fonts.googleapis.com/css2?family='+SCHRIFT[st]+'&display=swap':'';if(href&&l.getAttribute('href')!==href)l.href=href;
 const m=document.querySelector('meta[name=theme-color]');if(m)m.content=st==='vereinsheim'?'#F3F4F6':st==='flutlicht'?'#0E0F12':fa==='rw'?'#0E2240':'#0A0A0A'}
function slogan(){const sp=THEMES[themeAktiv()]?.sprueche;if(!sp)return'';const d=new Date(),doy=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);return sp[doy%sp.length]}
const neuZeichnen=()=>{applyTheme();if($('#app header')){shell();rerender()}};
act.stil=k=>{lsSet('kt_stil',k);neuZeichnen();toast(STILE[k].name)};
act.farbe=k=>{lsSet('kt_farbe',k);neuZeichnen();toast(FARBEN[k].name)};
act.hellDunkel=()=>{lsSet('kt_stil',stilAktiv()==='flutlicht'?'vereinsheim':'flutlicht');neuZeichnen()};
act.theme=act.stil;
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(stilWahl()==='auto')neuZeichnen()})}catch(_){}
applyTheme();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});

async function boot(){
 const h=location.hash;
 let m=h.match(/#k=([^&]+)/);if(m){Store.cfg={mode:'github',token:decodeURIComponent(m[1])};lsSet('kt_cfg',JSON.stringify(Store.cfg));history.replaceState(null,'',location.pathname)}
 m=h.match(/#s=([^&]+)/);if(m){try{const j=JSON.parse(atob(decodeURIComponent(m[1])));Store.cfg={mode:'github',token:j.t};lsSet('kt_cfg',JSON.stringify(Store.cfg))}catch(_){}history.replaceState(null,'',location.pathname)}
 if(!Store.cfg)return vSetup();
 $('#app').innerHTML='<div class="setup"><img src="logo.png" alt=""><p class="muted">Lade Vereinsdaten…</p></div>';
 try{await loadAll()}catch(e){if(Store.isDemo()){try{localStorage.clear()}catch(_){}return vSetup()}return vSetup(e.message)}
 if(!S.me||!M(S.me))return vWer();
 shell();render();
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){flushTermine();if(saveTimer)speichereAbend();return}
 if(S.verein&&Date.now()-S.loadedAt>60000&&!saveTimer&&!OUT.list.length&&!OUT.busy&&!$('#sheet'))loadAll().then(rerender).catch(()=>{})});
window.addEventListener('pagehide',()=>{flushTermine();if(saveTimer)speichereAbend()});
window.addEventListener('beforeunload',e=>{if(saveTimer||OUT.list.length){flushTermine();if(saveTimer)speichereAbend();e.preventDefault()}});
/* Sicherheitsnetz: diese Aktionen laufen nur mit entsperrtem Admin-Bereich */
['abendReset','abendResetGo','bLoeschen','buchen','ausgabe','excelStand','kAdd','kDel','kEdit','kSet','kStd','strafe','mEdit','mSave','terminNeu','serie','ausfall','tStatus','tLoeschen','karteImport','invite','sitzReset','fuerAndere']
 .forEach(k=>{const f=act[k];if(f)act[k]=(...a)=>isAdmin()?f(...a):act.adminLogin(()=>act[k](...a))});
boot();
</script>
</body>
</html>
