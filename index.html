<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">

<title>Schwelmer Kegeltreff</title>
<style>
:root{--gelb:#FDD615;--gelb2:#FFF6C7;--gelb3:#F3C800;--ink:#1D1D1B;--ink2:#55544f;--muted:#86847c;--linie:#ebe8de;--bg:#f5f4ef;--card:#fff;--rot:#b3261e;--rotbg:#fdeceb;--gruen:#1e7b34;--gruenbg:#e6f4ea;--r:18px;--hdr:58px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:6;background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;min-height:var(--hdr)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--gelb)}
header img{height:36px;background:#fff;border-radius:8px;padding:2px}
header .t{flex:1;min-width:0}header .t b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .t small{color:#cfcbbd;font-size:12px}
header .hb{background:none;border:0;color:#fff;font-size:20px;padding:6px;border-radius:10px}
#sync{font-size:12px;color:var(--gelb);white-space:nowrap}
main{padding:16px 14px calc(100px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--linie);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav .in{max-width:720px;margin:0 auto;display:flex}
nav button{flex:1;border:0;background:none;padding:2px 0;font-size:11.5px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button i{font-style:normal;font-size:20px;line-height:30px;width:58px;border-radius:99px;transition:background .15s}
nav button.on{color:var(--ink);font-weight:700}nav button.on i{background:var(--gelb)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 0 0 1px var(--linie)}
.card.hero{background:var(--ink);color:#fff;box-shadow:none}
.card.hero .muted{color:#cfcbbd}
h2{font-size:22px;margin:0 0 2px;line-height:1.2}h3{font-size:16px;margin:0 0 10px}
.sec{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 4px 8px}
.muted{color:var(--muted);font-size:14px}.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center}.row>.f{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.btn{border:0;background:#f0eee6;border-radius:14px;padding:12px 14px;font-weight:600;cursor:pointer;min-height:46px}
.btn.p{background:var(--gelb)}.btn.d{background:var(--ink);color:#fff}.btn.w{width:100%}
.btn.s{min-height:36px;padding:7px 12px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.4}
.x{border:0;background:none;color:var(--rot);padding:6px 8px;font-size:16px;cursor:pointer}
input,select,textarea{font:inherit;width:100%;padding:12px;border:1px solid var(--linie);border-radius:12px;background:#fff;color:var(--ink);min-height:46px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gelb3);border-color:transparent}
label{display:block;font-size:13px;color:var(--ink2);margin:10px 0 4px;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:0;border-radius:14px;padding:12px 4px;background:rgba(255,255,255,.1);color:#fff;font-weight:600;min-height:54px;cursor:pointer}
.seg button span{display:block;font-size:18px}
.seg .ja{background:#2e9e4d}.seg .vl{background:var(--gelb);color:var(--ink)}.seg .nein{background:#c4413a}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:0 0 auto;border:0;border-radius:99px;padding:9px 14px;background:#efede5;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff}.chip.an{background:var(--gruenbg);color:var(--gruen)}
.hero .chip{background:rgba(255,255,255,.12);color:#fff}.hero .chip.on{background:var(--gelb);color:var(--ink)}
.dchip{flex:0 0 auto;border:0;border-radius:16px;padding:8px 12px;background:#fff;box-shadow:0 0 0 1px var(--linie);text-align:center;cursor:pointer;min-width:74px}
.dchip b{display:block;font-size:15px}.dchip small{font-size:11px;color:var(--muted)}
.dchip.on{background:var(--ink);color:#fff;box-shadow:none}.dchip.on small{color:#cfcbbd}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle;background:#cfccc2}
.dot.ja{background:#2e9e4d}.dot.vl{background:var(--gelb3)}.dot.nein{background:#c4413a}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#efede5}
.pill.ja{background:var(--gruenbg);color:var(--gruen)}.pill.nein{background:var(--rotbg);color:var(--rot)}.pill.vl{background:var(--gelb2)}.pill.y{background:var(--gelb)}
.hero .pill{background:rgba(255,255,255,.14);color:#fff}
.av{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--gelb);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.av.s{width:30px;height:30px;font-size:12px}.av.ja{box-shadow:0 0 0 3px #2e9e4d}.av.vl{box-shadow:0 0 0 3px var(--gelb3)}.av.nein{opacity:.35}
ul.l{list-style:none;margin:0;padding:0}ul.l li{padding:10px 0;border-bottom:1px solid var(--linie);display:flex;gap:10px;align-items:center}
ul.l li:last-child{border-bottom:0}ul.l li .g{flex:1;min-width:0}
.menu li{cursor:pointer}.menu li .ic{font-size:22px;width:38px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.tap{padding:12px 6px;border-radius:16px;border:0;background:#f3f1ea;text-align:center;user-select:none;cursor:pointer;font-weight:600}
.tap b{display:block;font-size:28px;line-height:1.1}
.tap.minus{background:var(--rotbg)}.tap:active{transform:scale(.95);background:var(--gelb)}
.sticky{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top) + 3px);z-index:4;background:var(--bg);padding:8px 0;margin:-8px 0 4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;border-bottom:1px solid var(--linie);text-align:right}
th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--muted);font-weight:600}
tr.sum td{font-weight:800;border-top:2px solid var(--ink);border-bottom:0}
.big{font-size:34px;font-weight:800;letter-spacing:-.5px}
.rot{color:var(--rot)}.gruen{color:var(--gruen)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;z-index:30;max-width:90%;box-shadow:0 6px 24px rgba(0,0,0,.25);font-weight:600;font-size:14px}
.setup{max-width:420px;margin:24px auto;padding:0 16px;text-align:center}.setup img{width:150px;margin:10px 0}
.setup .card{text-align:left}
pre.order{white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:12px;font-size:14px;margin:8px 0}
details>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;justify-content:space-between}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"›";transform:rotate(90deg);font-size:22px;color:var(--muted);transition:transform .15s}
details[open]>summary::after{transform:rotate(270deg)}
.cat{margin:12px 0 4px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
.dish{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--linie);cursor:pointer;align-items:flex-start}
.dish .nr{min-width:38px;font-weight:800;background:var(--gelb2);border-radius:8px;text-align:center;padding:2px 0}.dish .pr{white-space:nowrap;font-weight:700}
.banner{background:var(--gelb2);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.drv{border-radius:16px;background:#f6f4ee;padding:12px;margin-bottom:8px}
.seats{display:flex;gap:4px;margin:6px 0}.seats span{width:22px;height:22px;border-radius:6px;background:#fff;box-shadow:0 0 0 1px var(--linie);font-size:12px;display:flex;align-items:center;justify-content:center}
.seats span.b{background:var(--ink);color:var(--gelb)}
.stepper{display:flex;align-items:center;gap:10px}.stepper button{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;cursor:pointer}
.stepper b{min-width:22px;text-align:center;font-size:18px}
#sheet .bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
#sheet .sh{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#fff;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;max-width:720px;margin:0 auto;animation:up .18s ease-out}
#sheet .grip{width:40px;height:5px;border-radius:9px;background:#d8d5cb;margin:0 auto 10px}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border-radius:16px;padding:12px;box-shadow:0 0 0 1px var(--linie)}
.tile .k{font-size:12px;color:var(--muted);font-weight:600}.tile .v{font-size:18px;font-weight:800;margin-top:2px}.tile .s{font-size:12px;color:var(--ink2)}
.bars .br{display:grid;grid-template-columns:26px 82px 1fr 58px;gap:6px;align-items:center;padding:4px 0;font-size:14px}
.bars .rk{color:var(--muted);font-size:12px;text-align:right}.bars .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bars .tr{height:18px;display:flex;align-items:center}.bars .bar{height:14px;border-radius:0 4px 4px 0;background:#4a4943;min-width:2px}
.bars .me .bar{background:var(--gelb3)}.bars .me .nm{color:var(--ink)}
.bars .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.cols{display:flex;align-items:flex-end;gap:3px;height:140px;border-bottom:1px solid #cfccc2;padding-top:6px}
.cols button{flex:1;border:0;background:none;padding:0;height:100%;display:flex;align-items:flex-end;cursor:pointer}
.cols button i{display:block;width:100%;background:#4a4943;border-radius:4px 4px 0 0;min-height:2px}
.cols button.on i{background:var(--gelb3)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =========================================================
   Schwelmer Kegeltreff – Vereins-App
   Code: öffentliches Repo „App“ (GitHub Pages) · Daten: privates Repo „App-Daten“ (data/*.json)
   ========================================================= */
const APP_VERSION='0.2.0';
const OWNER='Schwelmer-Kegeltreff-2016', REPO='App-Daten', BRANCH='main';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const eur=n=>r2(n).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const fmtN=(n,d=1)=>(+n||0).toLocaleString('de-DE',{maximumFractionDigits:d,minimumFractionDigits:0});
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isNaN(n)?0:n};
const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const fmtD=(iso,o={weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})=>new Date(iso+'T12:00:00').toLocaleDateString('de-DE',o);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clone=o=>JSON.parse(JSON.stringify(o));
const ini=n=>String(n||'?').replace(/[^A-Za-zÄÖÜäöü]/g,'').slice(0,2).toUpperCase();
function toast(msg,ms=2400){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
function vib(){try{navigator.vibrate&&navigator.vibrate(12)}catch(_){}}
function sheet(html){closeSheet();const d=document.createElement('div');d.id='sheet';d.innerHTML=`<div class="bg" onclick="closeSheet()"></div><div class="sh"><div class="grip"></div>${html}</div>`;document.body.appendChild(d)}
function closeSheet(){$('#sheet')?.remove()}
function ask(text,okLabel,fn,danger){window._askFn=fn;sheet(`<h3>${esc(text)}</h3><div class="row" style="margin-top:14px"><button class="btn f" onclick="closeSheet()">Abbrechen</button><button class="btn f ${danger?'d':'p'}" onclick="closeSheet();window._askFn()">${esc(okLabel)}</button></div>`)}

const DEFAULT_STRAFEN=[
 {id:'pudel',name:'Pudel',betrag:.10,art:'selbst'},
 {id:'glocke',name:'Glöckchen',betrag:.10,art:'selbst'},
 {id:'neun',name:'Alle Neune',betrag:.50,art:'andere'},
 {id:'kranz',name:'Kranz',betrag:1,art:'andere'},
 {id:'figur',name:'Figur vergessen',betrag:1,art:'selbst',schnapsJedesMal:3},
 {id:'rauchen',name:'Einsatz verpasst (Rauchen)',betrag:1,art:'selbst'},
 {id:'team',name:'Teamspiel verloren',betrag:1,art:'selbst'}];
const ANREISE={selbst:['🚗','Ich fahre'],mitfahrt:['🙋','Fahre mit'],oepnv:['🚌','Bus & Bahn'],taxi:['🚕','Taxi'],fuss:['🚶','Zu Fuß / Rad']};
const ZST={ja:'Dabei',vl:'Unsicher',nein:'Nicht dabei'};

/* ---------------- Speicher: GitHub (privates Repo) oder Demo (Browser) ---------------- */
const B64={enc:s=>btoa(unescape(encodeURIComponent(s))),dec:s=>decodeURIComponent(escape(atob(s.replace(/\s/g,''))))};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(_){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(_){}};
const Store={
 cfg:(()=>{const c=JSON.parse(lsGet('kt_cfg')||'null');return c?(c.mode==='demo'?c:{mode:'github',token:c.token}):null})(),
 isDemo(){return this.cfg?.mode==='demo'},
 url(p){return `https://api.github.com/repos/${OWNER}/${REPO}/contents/data/${p}`},
 hdr(){return{Authorization:'Bearer '+this.cfg.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}},
 async get(path){
  if(this.isDemo()){const v=lsGet('kt_demo:'+path);return{data:v?JSON.parse(v):null,sha:null}}
  const r=await fetch(this.url(path)+`?ref=${BRANCH}&_=${Date.now()}`,{headers:this.hdr(),cache:'no-store'});
  if(r.status===404)return{data:null,sha:null};
  if(!r.ok)throw await apiErr(r);
  const j=await r.json();
  if(!j.content&&j.download_url){const raw=await fetch(j.git_url,{headers:this.hdr()});const b=await raw.json();return{data:JSON.parse(B64.dec(b.content)),sha:j.sha}}
  return{data:JSON.parse(B64.dec(j.content)),sha:j.sha};
 },
 async put(path,data,sha,msg){
  if(this.isDemo()){lsSet('kt_demo:'+path,JSON.stringify(data));return 'demo'}
  const body={message:msg||('Update '+path),content:B64.enc(JSON.stringify(data,null,1)),branch:BRANCH};
  if(sha)body.sha=sha;
  const r=await fetch(this.url(path),{method:'PUT',headers:{...this.hdr(),'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw await apiErr(r);
  return (await r.json()).content.sha;
 },
 async mutate(path,fn,msg,def){
  for(let i=0;i<5;i++){
   const {data,sha}=await this.get(path);
   const nd=fn(data??clone(def??{}));
   try{await this.put(path,nd,sha,msg);return nd}
   catch(e){if(e.status===409||e.status===422){await sleep(300*(i+1));continue}throw e}
  }
  throw new Error('Gleichzeitige Änderung – bitte nochmal versuchen');
 }
};
async function apiErr(r){let m='';try{m=(await r.json()).message}catch(_){}
 const e=new Error(r.status===401?'Zugangsschlüssel ungültig oder abgelaufen':r.status===403?'Keine Berechtigung: '+m:r.status===404?'Daten-Repository nicht gefunden – passt der Zugangsschlüssel?':('GitHub-Fehler '+r.status+': '+m));e.status=r.status;return e}
function setSync(t){const s=$('#sync');if(s)s.textContent=t}
async function save(path,fn,msg,def){
 setSync('⏳');
 try{const d=await Store.mutate(path,fn,`${meName()}: ${msg}`,def);setSync('✓');setTimeout(()=>setSync(''),1500);return d}
 catch(e){setSync('⚠');toast('⚠ '+e.message,5000);throw e}
}

/* ---------------- Zustand ---------------- */
const S={verein:null,termine:null,kasse:null,karte:null,hist:null,me:lsGet('kt_me'),tab:lsGet('kt_tab')||'termine',sub:null,
 selT:null,abend:null,abendSha:null,abendFor:null,kat:'pudel',minus:false,best:null,bestFor:null,ef:{},kOpen:null,
 st:{zeit:null,metrik:'pudel',modus:'avg',spieler:null,vSel:null},loadedAt:0};
const M=id=>S.verein?.mitglieder.find(m=>m.id===id);
const nameOf=id=>M(id)?.spitzname||S.hist?.namen?.[id]||id;
const meName=()=>Store.isDemo()?'Demo':(M(S.me)?.spitzname||'?');
const aktive=()=>(S.verein?.mitglieder||[]).filter(m=>m.aktiv).sort((a,b)=>a.spitzname.localeCompare(b.spitzname,'de'));
const hasRole=r=>(M(S.me)?.rollen||[]).includes(r);
const isAdmin=()=>hasRole('admin');
const isKasse=()=>hasRole('admin')||hasRole('kassenwart');
const strafen=()=>S.verein?.strafen||DEFAULT_STRAFEN;
const termineSorted=()=>[...(S.termine?.termine||[])].sort((a,b)=>a.datum.localeCompare(b.datum));
const T=id=>S.termine?.termine.find(t=>t.id===id);
function naechsterTermin(){const h=todayISO();return termineSorted().find(t=>t.status==='geplant'&&t.datum>=h)||termineSorted().filter(t=>t.status==='geplant').pop()}
function abendTermin(){const h=todayISO();const ts=termineSorted();
 return ts.find(t=>t.datum===h&&t.status!=='ausgefallen')||ts.filter(t=>t.status==='geplant'&&t.datum<h).pop()||naechsterTermin()}

async function loadAll(){
 const [v,t,k]=await Promise.all([Store.get('verein.json'),Store.get('termine.json'),Store.get('kasse.json')]);
 if(!v.data)throw new Error('data/verein.json fehlt im Daten-Repository');
 S.verein=v.data;S.verein.strafen=S.verein.strafen||DEFAULT_STRAFEN;
 S.termine=t.data||{termine:[]};S.kasse=k.data||{buchungen:[]};S.loadedAt=Date.now();
}
async function loadKarte(force){if(S.karte&&!force)return;S.karte=(await Store.get('speisekarte.json')).data||{gerichte:[]}}
async function loadHist(force){if(S.hist&&!force)return;S.hist=(await Store.get('historie.json')).data||{abende:[],pokale:[],rekorde:null,legacy:null,namen:{}}}

/* ---------------- Berechnungen ---------------- */
function berechneAbend(abend,verein){
 const st=verein.strafen||DEFAULT_STRAFEN,pres=abend.spieler.filter(p=>p.anwesend),tot={},res={};
 st.forEach(s=>tot[s.id]=pres.reduce((a,p)=>a+(p.counts?.[s.id]||0),0));
 for(const p of pres){let s=0;
  for(const x of st){const own=p.counts?.[x.id]||0;s+=x.art==='andere'?(tot[x.id]-own)*x.betrag:own*x.betrag}
  s+=num(p.spiele);res[p.id]={strafe:r2(s)}}
 const max=Math.max(0,...pres.filter(p=>!p.gast).map(p=>res[p.id].strafe));
 const n=pres.length||1,g=num(abend.rechnung?.getraenke)/n,tg=num(abend.rechnung?.trinkgeld)/n;
 for(const p of abend.spieler){
  if(p.anwesend){const r=res[p.id];Object.assign(r,{getraenke:g,trinkgeld:tg,essen:num(p.essen),sonstiges:num(p.sonstiges)});
   r.gesamt=r2(r.strafe+g+tg+r.essen+r.sonstiges)}
  else if(!p.gast)res[p.id]={abwesend:true,strafe:r2(max),gesamt:r2(max)}}
 return{res,max:r2(max),tot};
}
function figurGesamt(mid,ohneTermin){const m=M(mid);let n=m?.figurVergessenGesamt||0;
 for(const t of S.termine.termine)if(t.id!==ohneTermin&&!t.inStartSaldo&&t.figur?.[mid])n+=t.figur[mid];return n}
function konto(mid){
 const v=S.verein,m=M(mid),items=[],heute=todayISO();if(!m)return{saldo:0,items};
 items.push({datum:v.startSaldoStichtag,text:'Übertrag aus Excel-Kassenbuch',betrag:m.startSaldo||0});
 const tDates=new Set(S.termine.termine.map(t=>t.datum));
 for(const t of termineSorted()){if(t.inStartSaldo||t.datum<(m.eintritt||'')||t.datum>heute&&t.status!=='abgeschlossen')continue;
  if(t.status==='abgeschlossen'&&t.abrechnung&&t.abrechnung[mid]!=null)items.push({datum:t.datum,text:t.abwesend?.includes(mid)?'Kegelabend (abwesend: höchste Strafe)':'Kegelabend',betrag:t.abrechnung[mid]});
  if(t.status==='ausgefallen')items.push({datum:t.datum,text:'Termin ausgefallen – Pauschale',betrag:v.pauschaleAusfall??15})}
 let d=addDays(v.startSaldoStichtag,1);while(new Date(d+'T12:00:00Z').getUTCDay()!==6)d=addDays(d,1);
 const mon={};for(;d<=heute;d=addDays(d,7)){if(tDates.has(d)||d<(m.eintritt||''))continue;const k=d.slice(0,7);mon[k]=mon[k]||{n:0,d};mon[k].n++;mon[k].d=d}
 for(const k in mon)items.push({datum:mon[k].d,text:`Wochenbeiträge ${fmtD(k+'-15',{month:'long',year:'numeric'})} (${mon[k].n}× ${eur(v.wochenbeitrag??5)})`,betrag:mon[k].n*(v.wochenbeitrag??5)});
 for(const b of S.kasse.buchungen.filter(b=>b.mitglied===mid)){
  const sign=b.art==='belastung'?1:-1;items.push({datum:b.datum,text:(b.art==='einzahlung'?'Einzahlung':b.art==='gutschrift'?'Gutschrift':'Belastung')+(b.text?': '+b.text:''),betrag:sign*num(b.betrag),bid:b.id})}
 items.sort((a,b)=>a.datum.localeCompare(b.datum));
 return{saldo:r2(items.reduce((a,i)=>a+i.betrag,0)),items};
}

async function setZusage(tid,who,patch,msg,check){

  if(z.anreise!=='mitfahrt')z.mitBei='';
  t.zusagen[who]=z;
  if(z.status==='nein'||z.anreise!=='selbst')for(const k in t.zusagen)if(t.zusagen[k].mitBei===who)t.zusagen[k].mitBei='';

 const backup=clone(S.termine);

}

 afterHooks.push(renderKarte);

function renderKarte(){const el=$('#karte');if(!el)return;const g=S.karte.gerichte||[],q=(S.kq||'').toLowerCase().trim();

function sammelText(t,pos){const grp={};
 pos.forEach(p=>{const k=(p.nr?p.nr+' ':'')+p.gericht;(grp[k]=grp[k]||[]).push(p)});
 const keys=Object.keys(grp).sort((a,b)=>(parseInt(a)||999)-(parseInt(b)||999)||a.localeCompare(b,'de'));

/* ---------------- STATISTIKEN ---------------- */
const KEYS=[['pudel','Pudel','🐩'],['glocke','Glöckchen','🔔'],['neun','Alle Neune','9️⃣'],['kranz','Kranz','🎯'],['figur','Figur vergessen','🗿'],['strafe','Strafen €','💸'],['abende','Abende','📅']];
function statAbende(){const h=S.hist?.abende||[],dates=new Set(h.map(a=>a.datum));
 const app=termineSorted().filter(t=>t.status==='abgeschlossen'&&t.stats&&!dates.has(t.datum)).map(t=>({datum:t.datum,quelle:'app',spieler:t.stats,strafen:t.strafen||{}}));
 return[...h,...app].sort((a,b)=>a.datum.localeCompare(b.datum))}
function aggregate(ab){const r={};const P=pid=>r[pid]??={pid,abende:0,pudel:0,glocke:0,neun:0,kranz:0,figur:0,spiele:0,strafe:0,strafeN:0,best:{}};
 for(const a of ab){for(const[pid,v]of Object.entries(a.spieler)){const x=P(pid);x.abende++;
   for(const k of['pudel','glocke','neun','kranz','figur','spiele']){x[k]+=+v[k]||0;if((+v[k]||0)>(x.best[k]?.wert||0))x.best[k]={wert:+v[k],datum:a.datum}}
   if(!a.strafen&&v.strafe!=null){x.strafe+=v.strafe;x.strafeN++}}
  for(const[pid,s]of Object.entries(a.strafen||{})){const x=P(pid);x.strafe+=s;x.strafeN++;if(s>(x.best.strafe?.wert||0))x.best.strafe={wert:s,datum:a.datum}}}
 return r}
const metricVal=(x,k,modus)=>k==='abende'?x.abende:k==='strafe'?(modus==='avg'?(x.strafeN?x.strafe/x.strafeN:null):(x.strafeN?x.strafe:null)):(modus==='avg'?(x.abende?x[k]/x.abende:null):x[k]);
function bars(rows,fmt,me){const max=Math.max(...rows.map(r=>r.v),0.0001);
 return`<div class="bars">${rows.map((r,i)=>`<div class="br ${r.pid===me?'me':''}" title="${esc(nameOf(r.pid))}: ${fmt(r.v)}${r.n!=null?' · '+r.n+' Abende':''}"><span class="rk">${i+1}.</span><span class="nm">${esc(nameOf(r.pid))}</span><span class="tr"><span class="bar" style="width:${Math.max(1,r.v/max*100)}%"></span></span><span class="val">${fmt(r.v)}</span></div>`).join('')}</div>`}
function vStatistik(){
 if(!S.hist){afterHooks.push(()=>loadHist().then(rerender).catch(e=>toast('⚠ '+e.message,5000)));return`<div class="card muted">Lade Statistiken…</div>`}
 const all=statAbende(),years=[...new Set(all.map(a=>a.datum.slice(0,4)))].sort().reverse();
 const st=S.st;if(!st.zeit)st.zeit=years[0]||'alle';
 const ab=st.zeit==='alle'?all:st.zeit==='letzter'?all.slice(-1):all.filter(a=>a.datum.startsWith(st.zeit));
 const ag=aggregate(ab),list=Object.values(ag),N=ab.length;
 let h=`<div class="chips" style="margin-bottom:12px">${[...years.map(y=>[y,y]),['alle','Alle Jahre'],['letzter','Letzter Abend']].map(([k,l])=>`<button class="chip ${st.zeit===k?'on':''}" onclick="S.st.zeit='${k}';S.st.vSel=null;rerender()">${l}</button>`).join('')}</div>`;
 if(!N)return h+`<div class="card muted">Für diesen Zeitraum gibt es noch keine Abende.</div>`;
 const minA=Math.max(1,Math.ceil(N/3)),reg=list.filter(x=>x.abende>=minA);
 const top=(k,dir=1,pool=list,avg=false)=>pool.filter(x=>metricVal(x,k,avg?'avg':'sum')!=null).sort((a,b)=>dir*(metricVal(b,k,avg?'avg':'sum')-metricVal(a,k,avg?'avg':'sum')))[0];
 const tile=(ic,k,x,val,sub)=>x?`<div class="tile"><div class="k">${ic} ${k}</div><div class="v">${esc(nameOf(x.pid))}</div><div class="s">${val}${sub?' · '+sub:''}</div></div>`:'';
 const pk=top('pudel',-1,reg,true),pt=top('pudel',1,reg,true),gl=top('glocke'),nn=top('neun'),kr=top('kranz'),fg=top('figur'),tr=top('abende'),sp=list.filter(x=>x.strafeN>=minA).sort((a,b)=>a.strafe/a.strafeN-b.strafe/b.strafeN)[0];
 h+=`<div class="muted small" style="margin:0 4px 8px">${N} ${N===1?'Abend':'Abende'}${st.zeit==='letzter'?' · '+fmtD(ab[0].datum):''}</div><div class="tiles">
 ${tile('👑','Pudelkönig',pk,fmtN(metricVal(pk,'pudel','avg'))+' Pudel/Abend','am wenigsten')}${tile('🐩','Pudeltrottel',pt,fmtN(metricVal(pt,'pudel','avg'))+' Pudel/Abend','am meisten')}
 ${tile('🔔','Glöckner',gl,gl?.glocke+' Glöckchen')}${tile('9️⃣','Alle-Neune-König',nn,nn?.neun+'× Alle Neune')}
 ${tile('🎯','Kranzkönig',kr,kr?.kranz+' Kränze')}${fg?.figur?tile('🗿','Figur vergessen',fg,fg.figur+'×'):''}
 ${st.zeit!=='letzter'?tile('📅','Treueste Seele',tr,tr?.abende+' von '+N+' Abenden'):''}${sp?tile('💸','Sparfuchs',sp,eur(sp.strafe/sp.strafeN)+' Ø Strafe'):''}</div>

 // Rekorde
 const rec=(k,l)=>{let b=null;for(const a of ab)for(const[pid,v]of Object.entries(a.spieler))if((+v[k]||0)>(b?.w||0))b={w:+v[k],pid,d:a.datum};return b?`<tr><td>${l}</td><td><b>${b.w}</b> · ${esc(nameOf(b.pid))}</td><td class="muted small">${fmtD(b.d,{day:'2-digit',month:'2-digit',year:'2-digit'})}</td></tr>`:''};

 // Ehrentafel

 if(id)return saveVerein(d=>Object.assign(d.mitglieder.find(x=>x.id===id),v),'Mitglied '+v.spitzname+' geändert');
 const nid=v.spitzname.toLowerCase().replace(/ß/g,'ss').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/[^a-z0-9]+/g,'-');if(M(nid))return toast('Spitzname existiert schon');
 saveVerein(d=>d.mitglieder.push({id:nid,...v,nr:Math.max(0,...d.mitglieder.map(m=>m.nr||0))+1,startSaldo:0,figurVergessenGesamt:0,schnapsrundenBezahlt:0}),'Mitglied '+v.spitzname+' aufgenommen')};
act.karteExport=async()=>{await loadKarte(true);$('#k-csv').value=S.karte.gerichte.map(g=>[g.nr,g.name,g.preis!=null?String(g.preis).replace('.',','):'',g.kategorie,g.beschreibung].join(';')).join('\n')};
act.karteImport=()=>{const lines=$('#k-csv').value.split('\n').map(l=>l.trim()).filter(Boolean);if(!lines.length)return toast('Keine Zeilen');
 const gerichte=lines.map(l=>{const [nr,name,preis,kategorie,beschreibung]=l.split(';').map(s=>(s||'').trim());return{nr,name,preis:preis?r2(num(preis)):null,kategorie:kategorie||'Sonstiges',beschreibung:beschreibung||''}}).filter(g=>g.name);
 ask(gerichte.length+' Gerichte speichern und die Karte ersetzen?','Speichern',async()=>{S.karte=await save('speisekarte.json',()=>({stand:'Gepflegt am '+fmtD(todayISO())+' von '+meName(),gerichte}),'Speisekarte aktualisiert');toast('Karte gespeichert ✓')})};
act.invite=async()=>{const l=location.origin+location.pathname+'#k='+encodeURIComponent(Store.cfg.token);
 try{await navigator.clipboard.writeText(l);toast('Link kopiert ✓')}catch(_){sheet(`<h3>Link kopieren</h3><textarea rows="4" onclick="this.select()">${esc(l)}</textarea><button class="btn w" style="margin-top:10px" onclick="closeSheet()">Fertig</button>`)}};

/* ---------------- Einrichtung ---------------- */
function vSetup(err){$('#app').innerHTML=`<div class="setup"><img src="logo.png" alt="Schwelmer Kegeltreff">
 <div class="card"><h3>Willkommen beim Kegeltreff</h3><p class="muted small" style="margin-top:0">Am einfachsten öffnest du den Einladungslink aus der WhatsApp-Gruppe. Alternativ hier den Zugangsschlüssel einfügen:</p>
 ${err?`<div class="banner rot">${esc(err)}</div>`:''}
 <label>Zugangsschlüssel</label><input id="s-t" type="password" autocapitalize="off" autocomplete="off" placeholder="github_pat_…">
 <button class="btn p w" style="margin-top:12px" onclick="act.connect($('#s-t').value)">Verbinden</button></div>
 <button class="btn" onclick="act.demo()">Erst mal ohne Daten ausprobieren (Demo)</button></div>`}
act.connect=async tok=>{Store.cfg={mode:'github',token:(tok||'').trim()};if(!Store.cfg.token)return vSetup('Bitte Zugangsschlüssel einfügen');
 $('#app').innerHTML='<div class="setup"><img src="logo.png" alt=""><p class="muted">Verbinde…</p></div>';
 try{await loadAll();lsSet('kt_cfg',JSON.stringify(Store.cfg));boot()}catch(e){Store.cfg=null;vSetup(e.message)}};
act.demo=()=>{Store.cfg={mode:'demo'};lsSet('kt_cfg',JSON.stringify(Store.cfg));demoSeed();lsSet('kt_me','anton');S.me='anton';boot()};
function vWer(){$('#app').innerHTML=`<div class="setup"><img src="logo.png" alt=""><div class="card"><h3>Wer bist du?</h3><ul class="l">${aktive().map(m=>`<li style="cursor:pointer" onclick="act.ich('${m.id}')"><div class="av s">${ini(m.spitzname)}</div><div class="g"><b>${esc(m.spitzname)}</b> <span class="muted small">${esc(m.vorname)} ${esc(m.nachname)}</span></div><span class="muted">›</span></li>`).join('')}</ul></div></div>`}
act.ich=id=>{S.me=id;lsSet('kt_me',id);boot()};
function demoSeed(){if(lsGet('kt_demo:verein.json'))return;
 const n=['Anton','Bernd','Carsten','Dirk','Erik','Frank','Gregor','Holger','Jens','Kai'],sal=[-120,35.5,210.4,-60,0,88.2,-15,140,-33.3,12];
 const h=todayISO();let sat=h;while(new Date(sat+'T12:00:00Z').getUTCDay()!==6)sat=addDays(sat,1);
 const v={name:'Schwelmer Kegeltreff (Demo)',ort:'Restaurant Samos, Wuppertal-Langerfeld',rhythmusWochen:5,wochenbeitrag:5,pauschaleAusfall:15,startSaldoStichtag:addDays(sat,-36),strafen:clone(DEFAULT_STRAFEN),
  mitglieder:n.map((x,i)=>({id:x.toLowerCase(),spitzname:x,vorname:x,nachname:'Mustermann',nr:i+1,eintritt:'2016-12-10',aktiv:true,rollen:i===0?['admin','kassenwart']:[],startSaldo:sal[i],figurVergessenGesamt:i%4,schnapsrundenBezahlt:0}))};
 const zs={};n.slice(0,6).forEach((x,i)=>zs[x.toLowerCase()]={status:i<4?'ja':'vl',anreise:['selbst','mitfahrt','oepnv','selbst','taxi','fuss'][i],plaetze:i===0?3:i===3?2:0,mitBei:i===1?'anton':'',bemerkung:''});
 const t={termine:[{...neuT(addDays(sat,-35)),status:'abgeschlossen',inStartSaldo:true},{...neuT(sat),zusagen:zs},neuT(addDays(sat,35)),neuT(addDays(sat,70))]};
 const k={stand:'Demo-Karte',gerichte:[['4','Tzatziki',5.5,'Kalte Vorspeisen',''],['32','Saganaki',8.9,'Käse','gebratener Käse'],['36','Griechischer Bauernsalat',12.5,'Salate',''],['60','Gyros',14.9,'Grill-Spezialitäten','Pommes, Reis, Salat'],['63','Suvlaki',15.5,'Grill-Spezialitäten',''],['65','Bifteki',16.9,'Grill-Spezialitäten','mit Schafskäse'],['71','Olympia-Teller',18.5,'Grillplatten','Gyros, Steak'],['76','Dorf-Platte',19.9,'Grillplatten','Suvlaki, Gyros, Bifteki'],['151','Jägerschnitzel',15.9,'Internationale Gerichte',''],['176','Musaka',15.5,'Lamm aus dem Backofen','']].map(([nr,name,preis,kategorie,beschreibung])=>({nr,name,preis,kategorie,beschreibung}))};
 const rnd=s=>{let x=s;return()=>(x=(x*9301+49297)%233280)/233280};const R=rnd(7);
 const hist={abende:[0,1,2,3,4,5].map(i=>({datum:addDays(sat,-35*(i+2)),quelle:'excel',spieler:Object.fromEntries(n.filter(()=>R()>.25).map(x=>[x.toLowerCase(),{pudel:Math.round(R()*16),glocke:Math.round(R()*2),neun:Math.round(R()*2),kranz:Math.round(R()*1.4),spiele:r2(R()*8),figur:R()>.9?1:0}]))})),pokale:[],rekorde:null,legacy:null,namen:{}};
 lsSet('kt_demo:verein.json',JSON.stringify(v));lsSet('kt_demo:termine.json',JSON.stringify(t));lsSet('kt_demo:kasse.json',JSON.stringify({buchungen:[]}));lsSet('kt_demo:speisekarte.json',JSON.stringify(k));lsSet('kt_demo:historie.json',JSON.stringify(hist))}

async function boot(){
 const h=location.hash;
 let m=h.match(/#k=([^&]+)/);if(m){Store.cfg={mode:'github',token:decodeURIComponent(m[1])};lsSet('kt_cfg',JSON.stringify(Store.cfg));history.replaceState(null,'',location.pathname)}
 m=h.match(/#s=([^&]+)/);if(m){try{const j=JSON.parse(atob(decodeURIComponent(m[1])));Store.cfg={mode:'github',token:j.t};lsSet('kt_cfg',JSON.stringify(Store.cfg))}catch(_){}history.replaceState(null,'',location.pathname)}
 if(!Store.cfg)return vSetup();
 $('#app').innerHTML='<div class="setup"><img src="logo.png" alt=""><p class="muted">Lade Vereinsdaten…</p></div>';
 try{await loadAll()}catch(e){if(Store.isDemo()){try{localStorage.clear()}catch(_){}return vSetup()}return vSetup(e.message)}
 if(!S.me||!M(S.me))return vWer();
 shell();render();
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.verein&&Date.now()-S.loadedAt>60000&&!saveTimer&&!$('#sheet'))loadAll().then(rerender).catch(()=>{})});
window.addEventListener('beforeunload',e=>{if(saveTimer){speichereAbend();e.preventDefault()}});
boot();
</script>
