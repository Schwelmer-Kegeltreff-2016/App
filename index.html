<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FDD615">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kegeltreff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Schwelmer Kegeltreff</title>
<style>
:root{--gelb:#FDD615;--gelb2:#FFF4B8;--schwarz:#1D1D1B;--grau:#6b6a64;--linie:#e7e4da;--bg:#f6f5f0;--rot:#c0392b;--gruen:#2e7d32;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--schwarz);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--schwarz);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:4px solid var(--gelb)}
header img{height:38px;background:#fff;border-radius:6px;padding:2px}
header .t{flex:1;font-weight:700;letter-spacing:.3px;line-height:1.1}
header .t small{display:block;font-weight:400;color:#cfcbbd;font-size:12px}
#sync{font-size:12px;color:var(--gelb)}
main{padding:14px 14px 96px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#fff;border-top:1px solid var(--linie);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 0 10px;font-size:11px;color:var(--grau);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px;line-height:1}
nav button.on{color:var(--schwarz);font-weight:700;box-shadow:inset 0 3px 0 var(--gelb)}
.card{background:#fff;border:1px solid var(--linie);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.hl{border:2px solid var(--gelb);box-shadow:0 2px 10px rgba(0,0,0,.05)}
h2{font-size:19px;margin:0 0 6px}h3{font-size:16px;margin:0 0 8px}
.muted{color:var(--grau);font-size:14px}.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1 1 auto}
.sp{justify-content:space-between}
button,.btn{font:inherit;border:1px solid var(--linie);background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--schwarz)}
.btn-p{background:var(--gelb);border-color:#e9c400;font-weight:700}
.btn-d{background:var(--schwarz);color:#fff;border-color:var(--schwarz);font-weight:700}
.btn-s{padding:6px 10px;font-size:14px}
.btn-x{border:0;background:none;color:var(--rot);padding:4px 8px}
button:disabled{opacity:.45}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--linie);border-radius:10px;background:#fff;color:var(--schwarz)}
label{display:block;font-size:13px;color:var(--grau);margin:8px 0 3px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:11px 4px}
.seg .on-ja{background:#e3f3e4;border-color:var(--gruen);font-weight:700}
.seg .on-vl{background:var(--gelb2);border-color:#e9c400;font-weight:700}
.seg .on-nein{background:#fbe3e0;border-color:var(--rot);font-weight:700}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:#eee;margin:2px 2px 2px 0}
.pill.ja{background:#e3f3e4}.pill.nein{background:#fbe3e0}.pill.vl{background:var(--gelb2)}.pill.y{background:var(--gelb)}
ul.l{list-style:none;margin:0;padding:0}ul.l li{padding:9px 0;border-bottom:1px solid var(--linie);display:flex;gap:8px;align-items:center}
ul.l li:last-child{border-bottom:0}ul.l li .g{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 11px;border-radius:99px;border:1px solid var(--linie);background:#fff;font-size:14px}
.chip.on{background:var(--schwarz);color:#fff;border-color:var(--schwarz)}
.chip.an{background:#e3f3e4;border-color:var(--gruen)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tap{padding:12px 6px;border-radius:12px;border:1px solid var(--linie);background:#fff;text-align:center;user-select:none}
.tap b{display:block;font-size:26px;line-height:1.1}
.tap.minus{background:#fbe3e0}
.tap:active{transform:scale(.96);background:var(--gelb2)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;border-bottom:1px solid var(--linie);text-align:right}
th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--grau);font-weight:600}
tr.sum td{font-weight:700;border-top:2px solid var(--schwarz)}
.big{font-size:30px;font-weight:800}
.rot{color:var(--rot)}.gruen{color:var(--gruen)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--schwarz);color:#fff;padding:10px 16px;border-radius:12px;z-index:20;max-width:90%;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.setup{max-width:440px;margin:30px auto;text-align:center}.setup img{width:170px}
.setup .card{text-align:left}
pre.order{white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:10px;font-size:14px;margin:8px 0}
details summary{cursor:pointer;font-weight:600;padding:4px 0}
.cat{margin:10px 0 4px;font-weight:700;font-size:14px;background:var(--gelb2);padding:4px 8px;border-radius:6px}
.dish{display:flex;gap:8px;padding:8px 2px;border-bottom:1px solid var(--linie);cursor:pointer}
.dish .nr{min-width:34px;font-weight:700}.dish .pr{white-space:nowrap;font-weight:600}
.banner{background:var(--gelb2);border:1px solid #e9c400;border-radius:10px;padding:8px 10px;font-size:14px;margin-bottom:10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =========================================================
   Schwelmer Kegeltreff – Vereins-App
   Code: öffentliches Repo (GitHub Pages) · Daten: privates Repo (data/*.json)
   ========================================================= */
const APP_VERSION='0.1.0';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const eur=n=>r2(n).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isNaN(n)?0:n};
const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const fmtD=(iso,o={weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})=>new Date(iso+'T12:00:00').toLocaleDateString('de-DE',o);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clone=o=>JSON.parse(JSON.stringify(o));
function toast(msg,ms=2600){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}

const DEFAULT_STRAFEN=[
 {id:'pudel',name:'Pudel',betrag:.10,art:'selbst'},
 {id:'glocke',name:'Glöckchen',betrag:.10,art:'selbst'},
 {id:'neun',name:'Alle Neune',betrag:.50,art:'andere'},
 {id:'kranz',name:'Kranz',betrag:1,art:'andere'},
 {id:'figur',name:'Figur vergessen',betrag:1,art:'selbst',schnapsJedesMal:3},
 {id:'rauchen',name:'Einsatz verpasst (Rauchen)',betrag:1,art:'selbst'},
 {id:'team',name:'Teamspiel verloren',betrag:1,art:'selbst'}];
const ANREISE={selbst:'🚗 Fahre selbst',mitfahrt:'🙋 Fahre mit / suche Mitfahrt',oepnv:'🚌 Bus & Bahn',taxi:'🚕 Taxi',fuss:'🚶 Zu Fuß / Rad',gebracht:'👋 Werde gebracht'};
const ZST={ja:'Dabei',vl:'Unsicher',nein:'Nicht dabei'};

/* ---------------- Speicher: GitHub (privates Repo) oder Demo (Browser) ---------------- */
const B64={enc:s=>btoa(unescape(encodeURIComponent(s))),dec:s=>decodeURIComponent(escape(atob(s.replace(/\s/g,''))))};
const Store={
 cfg:JSON.parse(localStorage.getItem('kt_cfg')||'null'),
 isDemo(){return this.cfg?.mode==='demo'},
 url(p){const c=this.cfg;return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/data/${p}`},
 hdr(){return{Authorization:'Bearer '+this.cfg.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}},
 async get(path){
  if(this.isDemo()){const v=localStorage.getItem('kt_demo:'+path);return{data:v?JSON.parse(v):null,sha:null}}
  const r=await fetch(this.url(path)+`?ref=${encodeURIComponent(this.cfg.branch||'main')}&_=${Date.now()}`,{headers:this.hdr(),cache:'no-store'});
  if(r.status===404)return{data:null,sha:null};
  if(!r.ok)throw await apiErr(r);
  const j=await r.json();return{data:JSON.parse(B64.dec(j.content)),sha:j.sha};
 },
 async put(path,data,sha,msg){
  if(this.isDemo()){localStorage.setItem('kt_demo:'+path,JSON.stringify(data));return 'demo'}
  const body={message:msg||('Update '+path),content:B64.enc(JSON.stringify(data,null,1)),branch:this.cfg.branch||'main'};
  if(sha)body.sha=sha;
  const r=await fetch(this.url(path),{method:'PUT',headers:{...this.hdr(),'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw await apiErr(r);
  return (await r.json()).content.sha;
 },
 /* liest frisch, wendet Änderung an, schreibt – bei Konflikt (gleichzeitige Änderung) automatisch erneut */
 async mutate(path,fn,msg,def){
  for(let i=0;i<5;i++){
   const {data,sha}=await this.get(path);
   const nd=fn(data??clone(def??{}));
   try{await this.put(path,nd,sha,msg);return nd}
   catch(e){if(e.status===409||e.status===422){await sleep(300*(i+1));continue}throw e}
  }
  throw new Error('Gleichzeitige Änderung – bitte nochmal versuchen');
 }
};
async function apiErr(r){let m='';try{m=(await r.json()).message}catch(_){}
 const e=new Error(r.status===401?'Zugangsschlüssel (Token) ungültig oder abgelaufen':r.status===403?'Keine Berechtigung: '+m:r.status===404?'Repository nicht gefunden':('GitHub-Fehler '+r.status+': '+m));e.status=r.status;return e}
function setSync(t){const s=$('#sync');if(s)s.textContent=t}
async function save(path,fn,msg,def){
 setSync('⏳ speichert…');
 try{const d=await Store.mutate(path,fn,`${meName()}: ${msg}`,def);setSync('✓ gespeichert');return d}
 catch(e){setSync('⚠ nicht gespeichert');toast('⚠ '+e.message,5000);throw e}
}

/* ---------------- Zustand ---------------- */
const S={verein:null,termine:null,kasse:null,karte:null,me:localStorage.getItem('kt_me'),tab:localStorage.getItem('kt_tab')||'termine',
 selT:null,form:null,abend:null,abendSha:null,abendFor:null,kat:'pudel',minus:false,best:null,bestFor:null,ef:{},kOpen:null,err:null};
const M=id=>S.verein?.mitglieder.find(m=>m.id===id);
const nameOf=id=>M(id)?.spitzname||id;
const meName=()=>Store.isDemo()?'Demo':(M(S.me)?.spitzname||'?');
const aktive=()=>(S.verein?.mitglieder||[]).filter(m=>m.aktiv).sort((a,b)=>a.spitzname.localeCompare(b.spitzname,'de'));
const hasRole=r=>(M(S.me)?.rollen||[]).includes(r);
const isAdmin=()=>hasRole('admin');
const isKasse=()=>hasRole('admin')||hasRole('kassenwart');
const strafen=()=>S.verein?.strafen||DEFAULT_STRAFEN;
const termineSorted=()=>[...(S.termine?.termine||[])].sort((a,b)=>a.datum.localeCompare(b.datum));
const T=id=>S.termine?.termine.find(t=>t.id===id);
function naechsterTermin(){const h=todayISO();return termineSorted().find(t=>t.status==='geplant'&&t.datum>=h)||termineSorted().filter(t=>t.status==='geplant').pop()}
function abendTermin(){const h=todayISO();const ts=termineSorted();
 return ts.find(t=>t.datum===h&&t.status!=='ausgefallen')||ts.filter(t=>t.status==='geplant'&&t.datum<h).pop()||naechsterTermin()}

async function loadAll(){
 const [v,t,k]=await Promise.all([Store.get('verein.json'),Store.get('termine.json'),Store.get('kasse.json')]);
 if(!v.data)throw new Error('data/verein.json fehlt im Daten-Repository');
 S.verein=v.data;S.verein.strafen=S.verein.strafen||DEFAULT_STRAFEN;
 S.termine=t.data||{termine:[]};S.kasse=k.data||{buchungen:[]};
}
async function loadKarte(force){if(S.karte&&!force)return;S.karte=(await Store.get('speisekarte.json')).data||{gerichte:[]}}

/* ---------------- Berechnungen ---------------- */
function berechneAbend(abend,verein){
 const st=verein.strafen||DEFAULT_STRAFEN,pres=abend.spieler.filter(p=>p.anwesend),tot={},res={};
 st.forEach(s=>tot[s.id]=pres.reduce((a,p)=>a+(p.counts?.[s.id]||0),0));
 for(const p of pres){let s=0;
  for(const x of st){const own=p.counts?.[x.id]||0;s+=x.art==='andere'?(tot[x.id]-own)*x.betrag:own*x.betrag}
  s+=num(p.spiele);res[p.id]={strafe:r2(s)}}
 const max=Math.max(0,...pres.filter(p=>!p.gast).map(p=>res[p.id].strafe));
 const n=pres.length||1,g=num(abend.rechnung?.getraenke)/n,tg=num(abend.rechnung?.trinkgeld)/n;
 for(const p of abend.spieler){
  if(p.anwesend){const r=res[p.id];Object.assign(r,{getraenke:g,trinkgeld:tg,essen:num(p.essen),sonstiges:num(p.sonstiges)});
   r.gesamt=r2(r.strafe+g+tg+r.essen+r.sonstiges)}
  else if(!p.gast)res[p.id]={abwesend:true,strafe:r2(max),gesamt:r2(max)}}
 return{res,max:r2(max),tot};
}
function figurGesamt(mid,ohneTermin){const m=M(mid);let n=m?.figurVergessenGesamt||0;
 for(const t of S.termine.termine)if(t.id!==ohneTermin&&!t.inStartSaldo&&t.figur?.[mid])n+=t.figur[mid];return n}
function konto(mid){
 const v=S.verein,m=M(mid),items=[],heute=todayISO();if(!m)return{saldo:0,items};
 items.push({datum:v.startSaldoStichtag,text:'Übertrag aus Excel-Kassenbuch',betrag:m.startSaldo||0});
 const tDates=new Set(S.termine.termine.map(t=>t.datum));
 for(const t of termineSorted()){if(t.inStartSaldo||t.datum<(m.eintritt||'')||t.datum>heute&&t.status!=='abgeschlossen')continue;
  if(t.status==='abgeschlossen'&&t.abrechnung&&t.abrechnung[mid]!=null)items.push({datum:t.datum,text:t.abwesend?.includes(mid)?'Kegelabend (abwesend: höchste Strafe)':'Kegelabend',betrag:t.abrechnung[mid]});
  if(t.status==='ausgefallen')items.push({datum:t.datum,text:'Termin ausgefallen – Pauschale',betrag:v.pauschaleAusfall??15})}
 // Wochenbeiträge: jeder Samstag ohne Termin nach dem Stichtag
 let d=addDays(v.startSaldoStichtag,1);while(new Date(d+'T12:00:00Z').getUTCDay()!==6)d=addDays(d,1);
 const mon={};for(;d<=heute;d=addDays(d,7)){if(tDates.has(d)||d<(m.eintritt||''))continue;const k=d.slice(0,7);mon[k]=mon[k]||{n:0,d};mon[k].n++;mon[k].d=d}
 for(const k in mon)items.push({datum:mon[k].d,text:`Wochenbeiträge ${fmtD(k+'-15',{month:'long',year:'numeric'})} (${mon[k].n}× ${eur(v.wochenbeitrag??5)})`,betrag:mon[k].n*(v.wochenbeitrag??5)});
 for(const b of S.kasse.buchungen.filter(b=>b.mitglied===mid)){
  const sign=b.art==='belastung'?1:-1;items.push({datum:b.datum,text:(b.art==='einzahlung'?'Einzahlung':b.art==='gutschrift'?'Gutschrift':'Belastung')+(b.text?': '+b.text:''),betrag:sign*num(b.betrag),bid:b.id})}
 items.sort((a,b)=>a.datum.localeCompare(b.datum));
 return{saldo:r2(items.reduce((a,i)=>a+i.betrag,0)),items};
}

/* ---------------- Rahmen ---------------- */
function shell(){
 $('#app').innerHTML=`<header><img src="logo.png" alt=""><div class="t">Schwelmer Kegeltreff<small>${esc(meName())}${Store.isDemo()?' · DEMO':''}</small></div><div id="sync"></div></header>
 <main id="main"></main>
 <nav>${[['termine','📅','Termine'],['abend','🎳','Abend'],['essen','🍽️','Essen'],['kasse','💶','Kasse'],['mehr','☰','Mehr']].map(([k,i,l])=>`<button class="${S.tab===k?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('')}</nav>`;
}
function go(tab){S.tab=tab;localStorage.setItem('kt_tab',tab);shell();render();window.scrollTo(0,0)}
function render(){const m=$('#main');if(!m)return;
 try{m.innerHTML=({termine:vTermine,abend:vAbend,essen:vEssen,kasse:vKasse,mehr:vMehr}[S.tab]||vTermine)();after()}
 catch(e){console.error(e);m.innerHTML=`<div class="card rot">Fehler: ${esc(e.message)}</div>`}}
let afterHooks=[];function after(){const h=afterHooks;afterHooks=[];h.forEach(f=>f())}
const terminOpts=(sel,filter=()=>true)=>termineSorted().filter(filter).map(t=>`<option value="${t.id}" ${t.id===sel?'selected':''}>${fmtD(t.datum)}${t.status==='ausgefallen'?' (ausgefallen)':t.status==='abgeschlossen'?' ✓':''}</option>`).join('');

/* ---------------- TERMINE ---------------- */
function initForm(t,who){const z=t.zusagen?.[who]||{};S.form={tid:t.id,who,status:z.status||'',anreise:z.anreise||'',plaetze:z.plaetze??3,mitBei:z.mitBei||'',gaeste:z.gaeste||0,bemerkung:z.bemerkung||''}}
function vTermine(){
 const t=T(S.selT)||naechsterTermin();
 if(!t)return`<div class="card">Noch keine Termine angelegt.${isAdmin()?' Unter „Mehr“ kannst du Termine anlegen.':''}</div>`;
 if(!S.form||S.form.tid!==t.id)initForm(t,S.me);
 const z=t.zusagen||{},akt=aktive(),c={ja:0,vl:0,nein:0,offen:0};let gaeste=0;
 akt.forEach(m=>{const s=z[m.id]?.status;c[s||'offen']++;if(s==='ja')gaeste+=+z[m.id].gaeste||0});
 const f=S.form,fahrer=akt.filter(m=>z[m.id]?.status!=='nein'&&z[m.id]?.anreise==='selbst');
 let h=`<div class="card hl"><div class="row sp"><div><h2>${fmtD(t.datum,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h2>
 <div class="muted">${esc(t.uhrzeit||'')} Uhr · ${esc(S.verein.ort||'Samos')}</div></div>
 <div style="flex:0">${t.status==='geplant'?'':`<span class="pill ${t.status==='ausgefallen'?'nein':'ja'}">${t.status}</span>`}</div></div>
 ${t.bemerkung?`<div class="banner" style="margin-top:8px">${esc(t.bemerkung)}</div>`:''}
 <div style="margin-top:6px"><span class="pill ja">✓ ${c.ja} dabei</span><span class="pill vl">? ${c.vl} unsicher</span><span class="pill nein">✗ ${c.nein} abgesagt</span><span class="pill">${c.offen} offen</span>${gaeste?`<span class="pill y">+${gaeste} Gast</span>`:''}</div></div>`;
 if(t.status==='geplant'){
  h+=`<div class="card"><h3>${f.who===S.me?'Deine Rückmeldung':'Rückmeldung für '+esc(nameOf(f.who))}</h3>
  ${isAdmin()?`<label>Eintragen für</label><select onchange="initForm(T('${t.id}'),this.value);render()">${akt.map(m=>`<option value="${m.id}" ${m.id===f.who?'selected':''}>${esc(m.spitzname)}</option>`).join('')}</select>`:''}
  <div class="seg" style="margin-top:8px">${['ja','vl','nein'].map(s=>`<button class="${f.status===s?'on-'+s:''}" onclick="S.form.status='${s}';render()">${s==='ja'?'✓ ':s==='vl'?'? ':'✗ '}${ZST[s]}</button>`).join('')}</div>
  ${f.status&&f.status!=='nein'?`<label>Wie kommst du hin?</label><select onchange="S.form.anreise=this.value;render()"><option value="">– bitte wählen –</option>${Object.entries(ANREISE).map(([k,v])=>`<option value="${k}" ${f.anreise===k?'selected':''}>${v}</option>`).join('')}</select>
   ${f.anreise==='selbst'?`<label>Freie Plätze zum Mitnehmen</label><input type="number" min="0" max="8" value="${f.plaetze}" oninput="S.form.plaetze=+this.value">`:''}
   ${f.anreise==='mitfahrt'?`<label>Fahre mit bei</label><select onchange="S.form.mitBei=this.value"><option value="">noch offen – suche Mitfahrt</option>${fahrer.filter(m=>m.id!==f.who).map(m=>`<option value="${m.id}" ${f.mitBei===m.id?'selected':''}>${esc(m.spitzname)}</option>`).join('')}</select>`:''}
   <label>Gäste, die ich mitbringe</label><input type="number" min="0" max="5" value="${f.gaeste}" oninput="S.form.gaeste=+this.value">`:''}
  <label>Bemerkung</label><input value="${esc(f.bemerkung)}" placeholder="z. B. komme später" oninput="S.form.bemerkung=this.value">

function renderAbendSum(){const el=$('#abend-sum');if(!el||!S.abend)return;

act.karteFilter=()=>{const y=scrollY,f=document.activeElement;render();scrollTo(0,y);const i=$('#main input[placeholder^="Suchen"]');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}};
act.nrEingabe=v=>{S.ef.nr=v.trim();const x=(S.karte.gerichte||[]).find(g=>g.nr&&String(g.nr)===S.ef.nr);if(x){S.ef.name=x.name;$('#e-name').value=x.name}};
act.waehle=i=>{const x=S.karte.gerichte[i];S.ef.nr=x.nr||'';S.ef.name=x.name;render();scrollTo({top:0,behavior:'smooth'})};
act.bestellen=async tid=>{const ef=S.ef;if(!ef.name?.trim())return toast('Bitte Nummer oder Gericht angeben');
 let fuer=ef.fuer||S.me,fuerName=nameOf(fuer);if(fuer==='gast'){fuerName=prompt('Name des Gastes?');if(!fuerName)return;fuer=fuerName}
 const x=(S.karte.gerichte||[]).find(g=>g.name===ef.name.trim()&&(!ef.nr||String(g.nr)===ef.nr));
 const p={id:'p'+Date.now().toString(36),fuer,fuerName,nr:ef.nr||x?.nr||'',gericht:ef.name.trim(),wunsch:(ef.wunsch||'').trim(),preis:x?.preis??null,von:S.me,ts:new Date().toISOString()};
 S.best=await save(`bestellungen/${tid}.json`,d=>{d.positionen=d.positionen||[];d.positionen.push(p);return d},`Bestellung ${fuerName}: ${p.nr} ${p.gericht}`,{positionen:[]});
 S.ef={fuer:S.ef.fuer};toast('Hinzugefügt ✓');render()};
act.posLoeschen=async(tid,id)=>{S.best=await save(`bestellungen/${tid}.json`,d=>{d.positionen=d.positionen.filter(p=>p.id!==id);return d},'Bestellposition gelöscht',{positionen:[]});render()};
act.kopieren=async()=>{const t=$('pre.order').textContent;try{await navigator.clipboard.writeText(t);toast('Kopiert ✓')}catch(_){toast('Kopieren nicht möglich')}};
act.teilen=()=>{const t=$('pre.order').textContent;if(navigator.share)navigator.share({text:t}).catch(()=>{});else location.href='https://wa.me/?text='+encodeURIComponent(t)};

/* ---------------- KASSE ---------------- */
function vKasse(){
 const mine=konto(S.me),alle=aktive().map(m=>({m,k:konto(m.id)}));
 const lbl=s=>s>0.004?`<span class="rot">${eur(s)} offen</span>`:s<-0.004?`<span class="gruen">${eur(-s)} Guthaben</span>`:'ausgeglichen';
 let h=`<div class="card hl"><div class="muted small">Dein Kontostand</div><div class="big ${mine.saldo>0?'rot':'gruen'}">${eur(Math.abs(mine.saldo))}</div><div>${mine.saldo>0.004?'noch zu überweisen':mine.saldo<-0.004?'Guthaben (zu viel überwiesen)':'ausgeglichen'}</div>
 ${mine.saldo>200?'<div class="banner" style="margin-top:8px">🎭 Mehr als 200 € Rückstand – laut Strafenkatalog ist beim nächsten Termin ein Kostüm fällig.</div>':''}
 <details style="margin-top:8px"><summary>Buchungen anzeigen</summary>${kontoTabelle(mine)}</details></div>`;
 if(isKasse())h+=`<div class="card"><h3>Buchung erfassen</h3><div class="row"><div><label>Mitglied</label><select id="b-m">${aktive().map(m=>`<option value="${m.id}">${esc(m.spitzname)}</option>`).join('')}</select></div>
  <div><label>Art</label><select id="b-a"><option value="einzahlung">Einzahlung (Überweisung)</option><option value="belastung">Belastung (+ offen)</option><option value="gutschrift">Gutschrift (− offen)</option></select></div></div>
  <div class="row"><div><label>Betrag €</label><input id="b-b" inputmode="decimal"></div><div><label>Datum</label><input id="b-d" type="date" value="${todayISO()}"></div></div>
  <label>Text</label><input id="b-t" placeholder="z. B. Dauerauftrag November">
  <button class="btn-p" style="width:100%;margin-top:10px" onclick="act.buchen()">Buchen</button></div>`;
 const sum=alle.reduce((a,x)=>a+x.k.saldo,0);
 h+=`<div class="card"><h3>Alle Mitglieder</h3><ul class="l">${alle.sort((a,b)=>b.k.saldo-a.k.saldo).map(({m,k})=>`<li style="cursor:pointer;display:block" onclick="S.kOpen=S.kOpen==='${m.id}'?null:'${m.id}';render()"><div class="row sp"><b>${esc(m.spitzname)}${k.saldo>200?' 🎭':''}</b><span style="flex:0;white-space:nowrap">${lbl(k.saldo)}</span></div>${S.kOpen===m.id?kontoTabelle(k,isKasse()):''}</li>`).join('')}</ul>
 <p class="muted small">Summe offen/Guthaben: ${eur(sum)} · Start-Salden aus dem Excel-Kassenbuch (Stand ${fmtD(S.verein.startSaldoStichtag)}), seitdem automatisch: Wochenbeiträge ${eur(S.verein.wochenbeitrag??5)} je Woche ohne Termin, ${eur(S.verein.pauschaleAusfall??15)} bei ausgefallenem Termin, abgerechnete Abende.</p></div>`;
 return h;
}
function kontoTabelle(k,del){return`<table style="margin-top:6px">${k.items.map(i=>`<tr><td class="small">${fmtD(i.datum,{day:'2-digit',month:'2-digit',year:'2-digit'})} ${esc(i.text)}${del&&i.bid?` <button class="btn-x" onclick="event.stopPropagation();act.bLoeschen('${i.bid}')">✕</button>`:''}</td><td class="${i.betrag>0?'rot':'gruen'}">${i.betrag>0?'+':''}${eur(i.betrag)}</td></tr>`).join('')}
 <tr class="sum"><td>Saldo (+ = offen)</td><td>${eur(k.saldo)}</td></tr></table>`}
act.buchen=async()=>{const b={id:'b'+Date.now().toString(36),mitglied:$('#b-m').value,art:$('#b-a').value,betrag:r2(num($('#b-b').value)),datum:$('#b-d').value,text:$('#b-t').value.trim(),von:S.me,ts:new Date().toISOString()};
 if(!b.betrag)return toast('Bitte Betrag eingeben');
 S.kasse=await save('kasse.json',d=>{d.buchungen=d.buchungen||[];d.buchungen.push(b);return d},`Buchung ${nameOf(b.mitglied)} ${b.art} ${b.betrag}`,{buchungen:[]});toast('Gebucht ✓');render()};
act.bLoeschen=async id=>{if(!confirm('Buchung löschen?'))return;S.kasse=await save('kasse.json',d=>{d.buchungen=d.buchungen.filter(b=>b.id!==id);return d},'Buchung gelöscht');render()};

/* ---------------- MEHR / ADMIN ---------------- */
function vMehr(){
 const m=M(S.me);let h=`<div class="card"><h3>Ich</h3><div>${esc(m?.vorname||'')} ${esc(m?.nachname||'')} („${esc(m?.spitzname||'')}“) ${(m?.rollen||[]).map(r=>`<span class="pill y">${r}</span>`).join('')}</div>
 <div class="muted small" style="margin-top:4px">${Store.isDemo()?'Demo-Modus – Daten nur in diesem Browser':'Verbunden mit '+esc(Store.cfg.owner+'/'+Store.cfg.repo)} · App ${APP_VERSION}</div>
 <div class="row" style="margin-top:10px"><button onclick="act.reload()">↻ Daten neu laden</button><button onclick="act.wechsel()">Person wechseln</button><button onclick="act.abmelden()">Abmelden</button></div></div>`;
 h+=`<div class="card"><h3>Strafenkatalog</h3><table>${strafen().map((s,i)=>`<tr><td>${esc(s.name)}${s.art==='andere'?' <span class="muted small">(für alle anderen)</span>':''}${s.schnapsJedesMal?` <span class="muted small">jedes ${s.schnapsJedesMal}. Mal + Runde Schnaps</span>`:''}</td><td style="width:100px">${isAdmin()?`<input inputmode="decimal" value="${String(s.betrag).replace('.',',')}" onchange="act.strafe(${i},this.value)">`:eur(s.betrag)}</td></tr>`).join('')}
 <tr><td>Platzierung Einzelspiel (2. bis Letzter)</td><td>0,10 € je Platz</td></tr><tr><td>Mehr als 200 € Rückstand</td><td>Kostüm</td></tr>
 <tr><td>Wochenbeitrag ohne Termin</td><td>${eur(S.verein.wochenbeitrag??5)}</td></tr><tr><td>Termin ausgefallen</td><td>${eur(S.verein.pauschaleAusfall??15)}</td></tr><tr><td>Abwesend</td><td>höchste Strafe des Abends</td></tr></table></div>`;
 if(!isAdmin())return h;
 h+=`<div class="card"><h3>Termine verwalten</h3><div class="row"><div><label>Datum</label><input id="t-d" type="date"></div><div><label>Uhrzeit</label><input id="t-u" type="time" value="18:00"></div></div>
 <label>Bemerkung</label><input id="t-b"><div class="row" style="margin-top:10px"><button class="btn-p" onclick="act.terminNeu()">+ Termin</button><button onclick="act.serie()">+ nächste 5 im 5-Wochen-Takt</button></div>
 <ul class="l" style="margin-top:8px">${termineSorted().filter(t=>t.datum>=addDays(todayISO(),-60)).map(t=>`<li><div class="g">${fmtD(t.datum)} <span class="muted small">${t.status}${t.bemerkung?' · '+esc(t.bemerkung):''}</span></div>
  ${t.status==='geplant'?`<button class="btn-s" onclick="act.ausfall('${t.id}')">Ausfall</button>`:t.status==='ausgefallen'?`<button class="btn-s" onclick="act.tStatus('${t.id}','geplant')">reaktivieren</button>`:''}${t.status!=='abgeschlossen'?`<button class="btn-x" onclick="act.tLoeschen('${t.id}')">✕</button>`:''}</li>`).join('')}</ul></div>`;
 h+=`<div class="card"><h3>Mitglieder</h3><ul class="l">${[...S.verein.mitglieder].sort((a,b)=>a.spitzname.localeCompare(b.spitzname,'de')).map(m=>`<li><div class="g"><b>${esc(m.spitzname)}</b> <span class="small">${esc(m.vorname)} ${esc(m.nachname)}</span> ${m.aktiv?'':'<span class="pill nein">inaktiv</span>'}${(m.rollen||[]).map(r=>`<span class="pill y">${r}</span>`).join('')}</div><button class="btn-s" onclick="act.mEdit('${m.id}')">✎</button></li>`).join('')}</ul>
 <button style="margin-top:8px" onclick="act.mNeu()">+ Mitglied</button></div>`;
 h+=`<div class="card"><h3>Speisekarte pflegen</h3><p class="muted small">Eine Zeile pro Gericht: <code>Nr;Gericht;Preis;Kategorie;Beschreibung</code>. Ersetzt die komplette Karte.</p>
 <textarea id="k-csv" rows="8" placeholder="12;Gyros;14,90;Grill;mit Pommes und Tzatziki"></textarea><div class="row" style="margin-top:8px"><button onclick="act.karteExport()">Aktuelle Karte laden</button><button class="btn-p" onclick="act.karteImport()">Karte speichern</button></div></div>`;
 if(!Store.isDemo())h+=`<div class="card"><h3>Einladungslink</h3><p class="muted small">Link mit Zugang zum Daten-Repo – nur privat in der WhatsApp-Gruppe teilen. Wer ihn öffnet, ist direkt verbunden.</p><button onclick="act.invite()">🔗 Link erzeugen & kopieren</button></div>`;
 return h;
}
act.reload=async()=>{await loadAll();S.karte=null;S.abendFor=null;S.bestFor=null;toast('Aktualisiert ✓');render()};
act.wechsel=()=>{localStorage.removeItem('kt_me');S.me=null;boot()};
act.abmelden=()=>{if(!confirm('Abmelden? Der Zugang wird auf diesem Gerät gelöscht.'))return;localStorage.removeItem('kt_cfg');localStorage.removeItem('kt_me');location.hash='';location.reload()};
const saveVerein=(fn,msg)=>save('verein.json',d=>{fn(d);return d},msg).then(d=>{S.verein=d;render()});
act.strafe=(i,v)=>saveVerein(d=>{d.strafen=d.strafen||clone(DEFAULT_STRAFEN);d.strafen[i].betrag=r2(num(v))},'Strafsatz geändert');
const saveTermine=(fn,msg)=>save('termine.json',d=>{fn(d);return d},msg).then(d=>{S.termine=d;render()});
const neuT=(datum,uhrzeit,bem)=>({id:datum,datum,uhrzeit:uhrzeit||'18:00',status:'geplant',bemerkung:bem||'',inStartSaldo:false,zusagen:{}});
act.terminNeu=()=>{const d=$('#t-d').value;if(!d)return toast('Datum fehlt');if(T(d))return toast('Termin existiert schon');saveTermine(x=>x.termine.push(neuT(d,$('#t-u').value,$('#t-b').value)),'Termin '+d+' angelegt')};
act.serie=()=>{const last=termineSorted().pop();let d=last?last.datum:todayISO();const neu=[];for(let i=0;i<5;i++){d=addDays(d,7*(S.verein.rhythmusWochen||5));neu.push(d)}
 if(!confirm('Anlegen: '+neu.map(x=>fmtD(x)).join(', ')+'?'))return;saveTermine(x=>neu.forEach(n=>x.termine.find(t=>t.id===n)||x.termine.push(neuT(n))),'Terminserie angelegt')};
act.ausfall=id=>{const g=prompt('Grund für den Ausfall (alle zahlen die Pauschale)?','Samos geschlossen');if(g===null)return;saveTermine(x=>{const t=x.termine.find(t=>t.id===id);t.status='ausgefallen';t.bemerkung=g},'Termin '+id+' ausgefallen')};
act.tStatus=(id,s)=>saveTermine(x=>{x.termine.find(t=>t.id===id).status=s},'Termin '+id+' '+s);
act.tLoeschen=id=>{if(confirm('Termin '+fmtD(id)+' löschen?'))saveTermine(x=>{x.termine=x.termine.filter(t=>t.id!==id)},'Termin '+id+' gelöscht')};
act.mEdit=id=>{const m=M(id),sp=prompt('Spitzname',m.spitzname);if(sp===null)return;const vn=prompt('Vorname',m.vorname);if(vn===null)return;const nn=prompt('Nachname',m.nachname);if(nn===null)return;
 const ro=prompt('Rollen (admin, kassenwart – kommagetrennt, leer = Mitglied)',(m.rollen||[]).join(', '));if(ro===null)return;const ak=confirm('Mitglied aktiv? (OK = aktiv, Abbrechen = ausgetreten)');
 saveVerein(d=>{Object.assign(d.mitglieder.find(x=>x.id===id),{spitzname:sp.trim(),vorname:vn.trim(),nachname:nn.trim(),rollen:ro.split(',').map(s=>s.trim()).filter(Boolean),aktiv:ak})},'Mitglied '+sp+' geändert')};
act.mNeu=()=>{const sp=prompt('Spitzname des neuen Mitglieds');if(!sp)return;const vn=prompt('Vorname')||'',nn=prompt('Nachname')||'',ein=prompt('Eintrittsdatum (JJJJ-MM-TT)',todayISO())||todayISO();
 const id=sp.toLowerCase().replace(/ß/g,'ss').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/[^a-z0-9]+/g,'-');if(M(id))return toast('ID existiert schon');
 saveVerein(d=>d.mitglieder.push({id,spitzname:sp,vorname:vn,nachname:nn,nr:Math.max(0,...d.mitglieder.map(m=>m.nr||0))+1,eintritt:ein,aktiv:true,rollen:[],startSaldo:0,figurVergessenGesamt:0,schnapsrundenBezahlt:0}),'Mitglied '+sp+' aufgenommen')};
act.karteExport=async()=>{await loadKarte(true);$('#k-csv').value=S.karte.gerichte.map(g=>[g.nr,g.name,g.preis!=null?String(g.preis).replace('.',','):'',g.kategorie,g.beschreibung].join(';')).join('\n')};
act.karteImport=async()=>{const lines=$('#k-csv').value.split('\n').map(l=>l.trim()).filter(Boolean);if(!lines.length)return toast('Keine Zeilen');
 const gerichte=lines.map(l=>{const [nr,name,preis,kategorie,beschreibung]=l.split(';').map(s=>(s||'').trim());return{nr,name,preis:preis?r2(num(preis)):null,kategorie:kategorie||'Sonstiges',beschreibung:beschreibung||''}}).filter(g=>g.name);
 if(!confirm(gerichte.length+' Gerichte speichern und die Karte ersetzen?'))return;
 S.karte=await save('speisekarte.json',()=>({stand:'Gepflegt am '+fmtD(todayISO())+' von '+meName(),gerichte}),'Speisekarte aktualisiert');toast('Karte gespeichert ✓')};
act.invite=async()=>{const c=Store.cfg,l=location.origin+location.pathname+'#s='+btoa(JSON.stringify({o:c.owner,r:c.repo,t:c.token,b:c.branch||'main'}));
 try{await navigator.clipboard.writeText(l);toast('Link kopiert ✓')}catch(_){prompt('Link kopieren:',l)}};

/* ---------------- Einrichtung ---------------- */
function vSetup(err){$('#app').innerHTML=`<div class="setup"><img src="logo.png" alt="Schwelmer Kegeltreff">
 <div class="card"><h3>Mit den Vereinsdaten verbinden</h3><p class="muted small">Die Zugangsdaten bekommst du vom Admin (am einfachsten als Einladungslink).</p>
 ${err?`<div class="banner rot">${esc(err)}</div>`:''}
 <label>GitHub-Organisation / Konto</label><input id="s-o" value="schwelmer-kegeltreff" autocapitalize="off">
 <label>Daten-Repository</label><input id="s-r" value="kegeltreff-daten" autocapitalize="off">
 <label>Zugangsschlüssel (Token)</label><input id="s-t" type="password" autocapitalize="off" placeholder="github_pat_…">
 <button class="btn-p" style="width:100%;margin-top:12px" onclick="act.connect()">Verbinden</button></div>
 <button onclick="act.demo()">Erst mal ohne Daten ausprobieren (Demo)</button></div>`}
act.connect=async()=>{Store.cfg={mode:'github',owner:$('#s-o').value.trim(),repo:$('#s-r').value.trim(),token:$('#s-t').value.trim(),branch:'main'};
 try{await loadAll();localStorage.setItem('kt_cfg',JSON.stringify(Store.cfg));boot()}catch(e){Store.cfg=null;vSetup(e.message)}};
act.demo=()=>{Store.cfg={mode:'demo'};localStorage.setItem('kt_cfg',JSON.stringify(Store.cfg));demoSeed();localStorage.setItem('kt_me','anton');S.me='anton';boot()};
function vWer(){$('#app').innerHTML=`<div class="setup"><img src="logo.png" alt=""><div class="card"><h3>Wer bist du?</h3><ul class="l">${aktive().map(m=>`<li style="cursor:pointer" onclick="act.ich('${m.id}')"><div class="g"><b>${esc(m.spitzname)}</b> <span class="muted small">${esc(m.vorname)} ${esc(m.nachname)}</span></div><span>›</span></li>`).join('')}</ul></div></div>`}
act.ich=id=>{S.me=id;localStorage.setItem('kt_me',id);boot()};
function demoSeed(){if(localStorage.getItem('kt_demo:verein.json'))return;
 const n=['Anton','Bernd','Carsten','Dirk','Erik','Frank','Gregor','Holger','Jens','Kai'],sal=[-120,35.5,210.4,-60,0,88.2,-15,140,-33.3,12];
 const h=todayISO();let sat=h;while(new Date(sat+'T12:00:00Z').getUTCDay()!==6)sat=addDays(sat,1);
 const v={name:'Schwelmer Kegeltreff (Demo)',ort:'Restaurant Samos, Wuppertal-Langerfeld',rhythmusWochen:5,wochenbeitrag:5,pauschaleAusfall:15,startSaldoStichtag:addDays(sat,-36),strafen:clone(DEFAULT_STRAFEN),
  mitglieder:n.map((x,i)=>({id:x.toLowerCase(),spitzname:x,vorname:x,nachname:'Mustermann',nr:i+1,eintritt:'2016-12-10',aktiv:true,rollen:i===0?['admin','kassenwart']:[],startSaldo:sal[i],figurVergessenGesamt:i%4,schnapsrundenBezahlt:0}))};
 const zs={};n.slice(0,6).forEach((x,i)=>zs[x.toLowerCase()]={status:i<4?'ja':'vl',anreise:['selbst','mitfahrt','oepnv','selbst','taxi','fuss'][i],plaetze:i===0?3:i===3?2:0,mitBei:i===1?'anton':'',gaeste:i===2?1:0,bemerkung:''});
 const t={termine:[{...neuT(addDays(sat,-35)),status:'abgeschlossen',inStartSaldo:true},{...neuT(sat),zusagen:zs},neuT(addDays(sat,35)),neuT(addDays(sat,70))]};
 const k={stand:'Demo-Karte',gerichte:[['10','Tzatziki',5.5,'Vorspeisen','mit Brot'],['12','Saganaki',8.9,'Vorspeisen','gebratener Käse'],['30','Griechischer Bauernsalat',12.5,'Salate','Feta, Oliven'],['51','Gyros',14.9,'Grill','Pommes, Tzatziki, Salat'],['52','Suvlaki',15.5,'Grill','2 Spieße'],['55','Bifteki',16.9,'Grill','mit Schafskäse gefüllt'],['60','Olympia-Teller',18.5,'Grillplatten','Gyros, Steak'],['63','Dorf-Platte',19.9,'Grillplatten','Suvlaki, Gyros, Bifteki'],['80','Jägerschnitzel',15.9,'International','Pommes, Salat'],['90','Musaka',15.5,'Lamm & Aufläufe','mit Béchamel']].map(([nr,name,preis,kategorie,beschreibung])=>({nr,name,preis,kategorie,beschreibung}))};
 localStorage.setItem('kt_demo:verein.json',JSON.stringify(v));localStorage.setItem('kt_demo:termine.json',JSON.stringify(t));localStorage.setItem('kt_demo:kasse.json',JSON.stringify({buchungen:[]}));localStorage.setItem('kt_demo:speisekarte.json',JSON.stringify(k))}

async function boot(){
 // Einladungslink #s=…
 const m=location.hash.match(/#s=([^&]+)/);
 if(m){try{const j=JSON.parse(atob(decodeURIComponent(m[1])));Store.cfg={mode:'github',owner:j.o,repo:j.r,token:j.t,branch:j.b||'main'};localStorage.setItem('kt_cfg',JSON.stringify(Store.cfg))}catch(_){}
  history.replaceState(null,'',location.pathname)}
 if(!Store.cfg)return vSetup();
 $('#app').innerHTML='<div class="setup"><img src="logo.png" alt=""><p class="muted">Lade Vereinsdaten…</p></div>';
 try{await loadAll()}catch(e){if(Store.isDemo()){localStorage.clear();return vSetup()}return vSetup(e.message)}
 if(!S.me||!M(S.me))return vWer();
 shell();render();
}
window.addEventListener('beforeunload',e=>{if(saveTimer&&$('#sync')?.textContent.includes('ungespeichert')){speichereAbend();e.preventDefault()}});
boot();
</script>
</body>
