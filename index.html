<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D1D1B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Kegeltreff">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Schwelmer Kegeltreff</title>
<style>
:root{--gelb:#FFD400;--gelb2:#FFF3B0;--gelb3:#F2C500;--ink:#111827;--ink2:#374151;--muted:#5B6270;--linie:#E5E7EB;--linie2:#CBD0D8;--bg:#F3F4F6;--card:#fff;--input:#fff;--chip:#EEF0F3;--tapbg:#F1F3F6;--rot:#b3261e;--rotbg:#fdeceb;--gruen:#1e7b34;--gruenbg:#e6f4ea;--r:20px;--hdr:58px;
 --dark:#111827;--on-accent:#111827;--hbar:var(--gelb);--navbg:#fff;--navtext:#5B6270;--navtext-on:#111827;--navon:var(--gelb);--navon-ink:var(--on-accent);--barc:#4B5563;--avtext:var(--gelb);
 --hero-accent:var(--gelb);--hero-accent-ink:var(--on-accent);--hero-bg:var(--dark);--slogan:var(--gelb);--glow:transparent;--slogan2:var(--ink);--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--font-d:var(--font);color-scheme:light}
/* ===== Stil: Vereinsheim (hell, ruhig) ===== */
[data-stil=vereinsheim]{--font:'Plus Jakarta Sans',system-ui,sans-serif;--font-d:var(--font);--r:22px;--navon:var(--dark);--navon-ink:#fff;--navtext-on:var(--ink);--slogan:var(--ink)}
/* ===== Stil: Flutlicht (dunkel, sportlich) ===== */
[data-stil=flutlicht]{--bg:#0E0F12;--card:#17191E;--input:#121418;--ink:#F2F2F0;--ink2:#C9CCD1;--muted:#A3A7AF;--linie:#2A2E36;--linie2:#3A3F49;--chip:#23262D;--tapbg:#1F2228;
 --dark:#2A2E36;--hero-bg:#17191E;--rot:#FF8A80;--rotbg:#3A1E1E;--gruen:#6EE7A0;--gruenbg:#14301F;--barc:#7A808B;--navbg:#17191E;--navtext:#A3A7AF;--navtext-on:#F2F2F0;
 --gelb2:#3A3314;--glow:rgba(255,212,0,.35);--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--font-d:'Space Grotesk',system-ui,sans-serif;color-scheme:dark}
/* ===== Stil: Anzeigetafel (plakativ, große Zahlen) ===== */
[data-stil=anzeigetafel]{--bg:#ECECE7;--ink:#0A0A0A;--ink2:#2E2E2B;--muted:#4A4A45;--linie:#D4D4CC;--linie2:#9C9C94;--chip:#E2E2DA;--tapbg:#fff;--dark:#0A0A0A;--r:6px;--barc:#0A0A0A;
 --navbg:var(--dark);--navtext:#BDBDB6;--navtext-on:#fff;--font:'Barlow',system-ui,sans-serif;--font-d:'Barlow Condensed','Arial Narrow',sans-serif}
/* ===== Farbwelt Rot-Weiß (FC Bayern) ===== */
[data-stil=flutlicht]{--slogan2:var(--gelb)}
[data-farbe=rw]{--slogan2:var(--gelb3);--gelb:#DC052D;--gelb2:#FDE3E8;--gelb3:#B00425;--on-accent:#fff;--hbar:#0066B2;--avtext:#fff;--slogan:#fff}
[data-stil=vereinsheim][data-farbe=rw]{--dark:#0E2240;--navon:#DC052D;--slogan:#DC052D}
[data-stil=flutlicht][data-farbe=rw]{--gelb2:#3A1420;--gelb3:#FF4D6A;--glow:rgba(220,5,45,.45);--avtext:#FF8095}
[data-stil=anzeigetafel][data-farbe=rw]{--dark:#0E2240;--barc:#0E2240;--hbar:#DC052D}
[data-farbe=rw] .hero .seg .ja{background:#0066B2}
.slogan{font-weight:800;letter-spacing:.3px;color:var(--slogan)}
main.wide{max-width:1180px}
@media (min-width:760px){.abend-2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
 .abend-2 .col-r{position:sticky;top:calc(var(--hdr) + 14px);max-height:calc(100vh - var(--hdr) - 96px);overflow:auto;border-radius:var(--r)}}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:6;background:var(--dark);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;min-height:var(--hdr)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--hbar)}
header img{height:42px;background:none;padding:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
header .t{flex:1;min-width:0}header .t b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .t small{color:rgba(255,255,255,.72);font-size:12px}
header .hb{background:none;border:0;color:#fff;font-size:20px;padding:6px;border-radius:10px}
#sync{font-size:12px;color:var(--gelb);white-space:nowrap}
main{padding:16px 14px calc(100px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--navbg);border-top:1px solid var(--linie);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav .in{max-width:720px;margin:0 auto;display:flex}
nav button{flex:1;border:0;background:none;padding:2px 0;font-size:11.5px;color:var(--navtext);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button i{font-style:normal;font-size:20px;line-height:30px;width:52px;border-radius:99px;transition:background .15s}
nav button.on{color:var(--navtext-on);font-weight:700}nav button.on i{background:var(--navon);color:var(--navon-ink)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 0 0 1px var(--linie)}
.card.hero{background:var(--hero-bg);color:#fff;box-shadow:none}
.card.hero .muted{color:rgba(255,255,255,.72)}
h2{font-size:22px;margin:0 0 2px;line-height:1.2}h3{font-size:16px;margin:0 0 10px}
.sec{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 4px 8px}
.muted{color:var(--muted);font-size:14px}.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center}.row>.f{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.btn{border:0;background:var(--chip);border-radius:14px;padding:12px 14px;font-weight:600;cursor:pointer;min-height:46px}
.btn.p{background:var(--gelb);color:var(--on-accent)}.btn.d{background:var(--dark);color:#fff}.btn.w{width:100%}
.btn.s{min-height:36px;padding:7px 12px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.4}
.x{border:0;background:none;color:var(--rot);padding:6px 8px;font-size:16px;cursor:pointer}
input,select,textarea{font:inherit;width:100%;padding:12px;border:1px solid var(--linie);border-radius:12px;background:var(--input);color:var(--ink);min-height:46px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gelb3);border-color:transparent}
label{display:block;font-size:13px;color:var(--ink2);margin:10px 0 4px;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:0;border-radius:14px;padding:12px 4px;background:rgba(255,255,255,.1);color:#fff;font-weight:600;min-height:54px;cursor:pointer}
.seg button span{display:block;font-size:18px}
.seg .ja{background:#2e9e4d}.seg .vl{background:var(--gelb);color:var(--on-accent)}.seg .nein{background:#c4413a}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:0 0 auto;border:0;border-radius:99px;padding:9px 14px;background:var(--chip);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--dark);color:#fff}.chip.an{background:var(--gruenbg);color:var(--gruen)}
[data-stil=flutlicht] .chip.on{background:var(--gelb);color:var(--on-accent);box-shadow:0 0 0 2px var(--ink)}
.hero .chip{background:rgba(255,255,255,.12);color:#fff}.hero .chip.on{background:var(--hero-accent);color:var(--hero-accent-ink)}
.hero .btn.p,.hero .seg .vl{background:var(--hero-accent);color:var(--hero-accent-ink)}
.dchip{flex:0 0 auto;border:0;border-radius:16px;padding:8px 12px;background:var(--card);box-shadow:0 0 0 1px var(--linie);text-align:center;cursor:pointer;min-width:74px}
.dchip b{display:block;font-size:15px}.dchip small{font-size:11px;color:var(--muted)}
.dchip.on{background:var(--dark);color:#fff;box-shadow:none}.dchip.on small{color:rgba(255,255,255,.72)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle;background:var(--linie2)}
.dot.ja{background:#2e9e4d}.dot.vl{background:var(--gelb3)}.dot.nein{background:#c4413a}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--chip)}
.pill.ja{background:var(--gruenbg);color:var(--gruen)}.pill.nein{background:var(--rotbg);color:var(--rot)}.pill.vl{background:var(--gelb2)}.pill.y{background:var(--gelb);color:var(--on-accent)}
.hero .pill{background:rgba(255,255,255,.14);color:#fff}
.av{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--dark);color:var(--avtext);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.av.s{width:30px;height:30px;font-size:12px}.av.ja{box-shadow:0 0 0 3px #2e9e4d}.av.vl{box-shadow:0 0 0 3px var(--gelb3)}.av.nein{opacity:.35}
ul.l{list-style:none;margin:0;padding:0}ul.l li{padding:10px 0;border-bottom:1px solid var(--linie);display:flex;gap:10px;align-items:center}
ul.l li:last-child{border-bottom:0}ul.l li .g{flex:1;min-width:0}
.menu li{cursor:pointer}.menu li .ic{font-size:22px;width:38px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.tap{padding:12px 6px;border-radius:16px;border:0;background:var(--tapbg);text-align:center;user-select:none;cursor:pointer;font-weight:600}
.tap b{display:block;font-size:28px;line-height:1.1}
.tap.minus{background:var(--rotbg)}.tap:active{transform:scale(.95);background:var(--gelb)}
.sticky{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top) + 3px);z-index:4;background:var(--bg);padding:8px 0;margin:-8px 0 4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;border-bottom:1px solid var(--linie);text-align:right}
th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--muted);font-weight:600}
tr.sum td{font-weight:800;border-top:2px solid var(--ink);border-bottom:0}
.big{font-size:34px;font-weight:800;letter-spacing:-.5px}
.rot{color:var(--rot)}.gruen{color:var(--gruen)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--dark);color:#fff;padding:11px 18px;border-radius:14px;z-index:30;max-width:90%;box-shadow:0 6px 24px rgba(0,0,0,.25);font-weight:600;font-size:14px}
.setup{max-width:420px;margin:24px auto;padding:0 16px;text-align:center}.setup img{width:150px;margin:10px 0}
.setup .card{text-align:left}
pre.order{white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:12px;font-size:14px;margin:8px 0}
details>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;justify-content:space-between}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"›";transform:rotate(90deg);font-size:22px;color:var(--muted);transition:transform .15s}
details[open]>summary::after{transform:rotate(270deg)}
.cat{margin:12px 0 4px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
.dish{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--linie);cursor:pointer;align-items:flex-start}.dish.getr{cursor:default}.stern{flex:0 0 auto;border:0;background:none;font-size:24px;line-height:1;width:40px;height:40px;margin:-8px -6px -8px 0;color:var(--ink2);cursor:pointer;border-radius:50%}.stern.an{color:#E0A800}[data-stil=flutlicht] .stern.an{color:var(--gelb)}.dish.getr .nr{background:var(--chip)}
.kgr{border-bottom:1px solid var(--linie)}.kgr-k{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:13px 2px;cursor:pointer;font-size:15px}.kgr-k b{flex:1}.kgr-k .pf{display:inline-block;width:14px;transition:transform .15s;color:var(--ink2)}.kgr.auf .kgr-k .pf{transform:rotate(90deg)}.kgr-i{padding:0 0 8px 6px}.kgr-i .dish:last-child{border-bottom:0}.kgr.fav .kgr-k b{color:var(--ink)}.kgr.fav{background:var(--gelb2);border-radius:12px;padding:0 10px;margin:4px 0 6px;border-bottom:0}
.dish .nr{min-width:38px;font-weight:800;background:var(--gelb2);border-radius:8px;text-align:center;padding:2px 0}.dish .pr{white-space:nowrap;font-weight:700}
.banner{background:var(--gelb2);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.drv{border-radius:16px;background:var(--tapbg);padding:12px;margin-bottom:8px}
.seats{display:flex;gap:4px;margin:6px 0}.seats span{width:22px;height:22px;border-radius:6px;background:var(--card);box-shadow:0 0 0 1px var(--linie);font-size:12px;display:flex;align-items:center;justify-content:center}
.seats span.b{background:var(--dark);color:var(--avtext)}
.stepper{display:flex;align-items:center;gap:10px}.stepper button{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;cursor:pointer}
.stepper b{min-width:22px;text-align:center;font-size:18px}
#sheet .bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
#sheet .sh{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;max-width:720px;margin:0 auto;animation:up .18s ease-out}
#sheet .grip{width:40px;height:5px;border-radius:9px;background:#d8d5cb;margin:0 auto 10px}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sec.fold{cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}.sec.fold::after{content:'▾';font-size:14px;color:var(--muted)}.sec.zu::after{content:'▸'}.sec.zu{margin-bottom:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:16px;padding:12px;box-shadow:0 0 0 1px var(--linie)}
.tile .k{font-size:12px;color:var(--muted);font-weight:600}.tile .v{font-size:18px;font-weight:800;margin-top:2px}.tile .s{font-size:12px;color:var(--ink2)}
.bars .br{display:grid;grid-template-columns:26px 82px 1fr 58px;gap:6px;align-items:center;padding:4px 0;font-size:14px}
.bars .rk{color:var(--muted);font-size:12px;text-align:right}.bars .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bars .tr{height:18px;display:flex;align-items:center}.bars .bar{height:14px;border-radius:0 4px 4px 0;background:var(--barc);min-width:2px}
.bars .me .bar{background:var(--gelb3)}.bars .me .nm{color:var(--ink)}
.bars .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.cols{display:flex;align-items:flex-end;gap:3px;height:140px;border-bottom:1px solid var(--linie2);padding-top:6px}
.cols button{flex:1;border:0;background:none;padding:0;height:100%;display:flex;align-items:flex-end;cursor:pointer}
.cols button i{display:block;width:100%;background:var(--barc);border-radius:4px 4px 0 0;min-height:2px}
.cols button.on i{background:var(--gelb3)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}

.kopf2{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}.kopf2 .kopfsel,.kopf2>.card{margin:0;width:100%}
.chips.anw{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.chips.anw .chip{text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chips.anw .chip.gast{grid-column:span 2}
.sitzk summary{gap:8px}.sitzk .sk{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:14px}
.sitzk .hero{margin:0}.pill.warn{background:var(--gelb);color:#1a1a1a;border-radius:99px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.katnav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px;padding:2px}.katnav::-webkit-scrollbar{display:none}
.kat{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:0;border-radius:14px;padding:8px 12px;background:var(--chip);color:inherit;font-weight:700;font-size:14px;text-align:left;cursor:pointer;line-height:1.15}
.kat i{font-style:normal;font-size:20px}.kat small{display:block;font-weight:500;font-size:11px;opacity:.7}
.kat.on{background:var(--dark);color:#fff;box-shadow:0 0 0 2px var(--gelb)}
@media (min-width:640px){
 .erf{display:grid;grid-template-columns:250px minmax(0,1fr);gap:12px;align-items:start}
 .katnav{display:grid;grid-template-columns:1fr 1fr;overflow:visible;margin:0;position:sticky;top:calc(var(--hdr) + 10px)}
 .kat{padding:8px 9px;min-height:48px}
 .erf-main{margin-bottom:12px}}
@media (min-width:1000px){.erf{grid-template-columns:300px minmax(0,1fr)}.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}}

#upd{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top));z-index:5}
#upd .upd{display:flex;align-items:center;gap:12px;width:calc(100% - 28px);max-width:692px;margin:10px auto 0;border:0;border-radius:16px;padding:12px 12px 12px 16px;background:var(--gelb);color:var(--on-accent);text-align:left;cursor:pointer;box-shadow:0 8px 24px -10px rgba(0,0,0,.45);animation:updIn .35s ease-out}
#upd .tx{flex:1;min-width:0;display:flex;flex-direction:column}#upd .tx b{font-size:15px}#upd .tx small{font-size:12.5px;opacity:.85;line-height:1.3;margin-top:2px}
#upd .go{flex:0 0 auto;background:var(--dark);color:#fff;border-radius:11px;padding:9px 12px;font-weight:700;font-size:14px;white-space:nowrap}
@keyframes updIn{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}

/* Anleitung & Rundgang */
.anl-link{display:block;margin:6px auto 4px;border:0;background:none;color:var(--muted);font-size:14px;padding:12px;cursor:pointer;text-align:center;width:100%}
.anl-link u{color:var(--ink);text-underline-offset:3px;font-weight:600}.anl-link.upd-link{margin-top:-10px;font-size:13px}
.drei{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:6px}.drei .tile{position:relative}
@media (max-width:560px){.drei{grid-template-columns:1fr}.drei .tile{display:grid;grid-template-columns:40px 1fr;column-gap:10px;align-items:center}.drei .tile>div:first-of-type{grid-row:span 2;margin:0;text-align:center}.drei .tile b,.drei .tile .small{grid-column:2}}
.drei .nr{position:absolute;top:8px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--gelb);color:var(--on-accent);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.anl summary .ic{display:inline-block;width:30px;font-size:20px}.anl .anl-b{margin-top:10px}
ol.steps{margin:10px 0 6px;padding:0;list-style:none;counter-reset:st}
ol.steps li{counter-increment:st;position:relative;padding:6px 0 8px 36px;font-size:15px;line-height:1.45}
ol.steps li::before{content:counter(st);position:absolute;left:0;top:5px;width:24px;height:24px;border-radius:50%;background:var(--dark);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.ill{margin:6px 0 10px;border-radius:calc(var(--r) + 4px);background:var(--bg);padding:12px;box-shadow:inset 0 0 0 1px var(--linie)}

function berechneAbend(abend,verein){

   else if(!p.gast)res[p.id]={abwesend:true,strafe:r2(max),gesamt:r2(max)}}
  return{res,max:r2(max),tot,anteil:z.anteil1,gesamt:z.gesamt,exSum:z.zSum+z.rSum,n,v2:z}}

const rechnungV2=R=>R&&(R.v===2||R.essen!=null||R.runden!=null||R.ohneEssen!=null);
function topfRechnung(R,pres,verein){const schw=num(R.schw)||(verein?.teuerSchwelle??20),pids=new Set(pres.map(p=>p.id)),ohne=new Set(R.ohneEssen||[]);

/* Bild aufbereiten: farbiger Hintergrund (Holztisch) wird weiß, Papier per Otsu-Schwelle schwarz/weiß.

 for(let t=0;t<256;t++){wB+=hist[t];if(!wB)continue;const wF=cnt-wB;if(!wF)break;sB+=t*hist[t];const mB=sB/wB,mF=(sum-sB)/wF,v=wB*wF*(mB-mF)*(mB-mF);if(v>best){best=v;thr=t}}

 const pos=[];let total=null,mw={},netto={},vor=null;

   let menge=+((z.match(/^\D{0,3}(\d{1,3})\s?[xX]\b/)||vor?.match(/^\D{0,3}(\d{1,3})\s?[xX]/)||[])[1])||1;
   let name=z.replace(/\s*€?\s*\d{1,4}\s?[.,]\s?\d{2}\s*[AB8ß]*\W*$/i,'').replace(/^\D{0,3}\d{1,3}\s?[xX]\s*/,'').replace(/#?\d{1,5}\s+/,'').replace(/\s*(?:[aä&]\s*)?€.*$/i,'').replace(/[^A-Za-zÄÖÜäöüß0-9 ,.\-]/g,'').trim();

/* ---------------- MINISPIEL „Ein Wurf“ ----------------
   Neun Kegel als Raute, eine Kugel. Antippen oder nach oben wischen = Wurf. Der Zufall entscheidet:
   Pudel (15 %), 1–8 Holz, Kranz (8 Holz, König bleibt stehen – 6 %), Alle Neune (10 %).
   Ergebnisse landen in minispiel.json (Statistik & Bestenliste). Beim App-Start höchstens alle 3 Stunden,
   abschaltbar im Profil, jederzeit über die Startseite. */
const MINI_AN=()=>lsGet('kt_mini')!=='0';
function miniWurfZiehen(){const r=Math.random()*100;if(r<15)return{typ:'pudel',holz:0};if(r<25)return{typ:'neun',holz:9};if(r<31)return{typ:'kranz',holz:8};
 const g=[[1,5],[2,6],[3,8],[4,9],[5,10],[6,11],[7,11],[8,9]];let x=Math.random()*69;for(const[h,w]of g){if((x-=w)<0)return{typ:'holz',holz:h}}return{typ:'holz',holz:5}}
const MINI_TXT={neun:['🎉','Alle Neune!','Gut Holz – alles abgeräumt!'],kranz:['👑','Kranz!','Acht um den König – der bleibt stehen.'],pudel:['🐩','Haha – ein Pudel!','0,10 € in die Kasse … war nur Spaß.']};
const miniHolzTxt=h=>h>=7?['💪',h+' Holz','Stark geworfen!']:h>=4?['👍',h+' Holz','Solide – da geht noch was.']:['😬',h+' Holz','Naja … nächstes Mal mehr.'];
function minispiel(manuell){if($('#mini'))return;const reduziert=matchMedia('(prefers-reduced-motion: reduce)').matches;lsSet('kt_mini_ts',String(Date.now()));
 const box=document.createElement('div');box.id='mini';box.setAttribute('role','dialog');box.setAttribute('aria-label','Minispiel');
 box.innerHTML=`<canvas></canvas><div class="mi-top"><b>🎳 Ein Wurf – was wird’s?</b><button class="mi-skip" onclick="miniZu()">${manuell?'Schließen':'Überspringen'}</button></div>
  <div class="mi-hint">Antippen oder nach oben wischen</div><div class="mi-erg" hidden></div>`;
 document.body.appendChild(box);
 const cv=box.querySelector('canvas'),ctx=cv.getContext('2d'),dpr=Math.min(2,devicePixelRatio||1),W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
 const akz=getComputedStyle(document.documentElement).getPropertyValue('--gelb').trim()||'#FFD400';
 const sz=Math.min(W*.15,H*.11,92),cx=W/2,cy=H*.3,dx=sz*.56,dy=sz*.3;
 const pins=[];for(let r=0;r<3;r++)for(let c=0;c<3;c++)pins.push({r,c,x:cx+(c-r)*dx,y:cy+(c+r-2)*dy,front:4-(c+r),koenig:r===1&&c===1,fall:false,rot:0,vx:0,vy:0,vr:0,a:1,wob:0});
 pins.sort((a,b)=>a.y-b.y);
 const bahnL=cx-dx*2-sz*.55,bahnR=cx+dx*2+sz*.55,startY=H*.86,ball={x:cx,y:startY,r:sz*.3};
 const kegel=(p)=>{ctx.save();ctx.globalAlpha=p.a;ctx.translate(p.x,p.y);ctx.rotate(p.rot+Math.sin(p.wob)*.08*Math.min(1,p.wob/3));const s=sz;
  ctx.beginPath();ctx.moveTo(-s*.13,0);ctx.bezierCurveTo(-s*.24,-s*.22,-s*.2,-s*.46,-s*.07,-s*.6);ctx.bezierCurveTo(-s*.03,-s*.66,-s*.13,-s*.8,-s*.08,-s*.92);
  ctx.arc(0,-s*.9,s*.09,Math.PI*1.1,Math.PI*1.9);ctx.bezierCurveTo(s*.13,-s*.8,s*.03,-s*.66,s*.07,-s*.6);ctx.bezierCurveTo(s*.2,-s*.46,s*.24,-s*.22,s*.13,0);ctx.closePath();
  ctx.fillStyle=p.koenig?'#fff6d6':'#fafafa';ctx.fill();ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=Math.max(1,s*.02);ctx.stroke();
  ctx.fillStyle=p.koenig?akz:'#d7263d';ctx.fillRect(-s*.075,-s*.72,s*.15,s*.035);ctx.fillRect(-s*.07,-s*.665,s*.14,s*.025);ctx.restore()};
 const kugel=(x,y,r,rot)=>{ctx.save();ctx.translate(x,y);ctx.rotate(rot);const g=ctx.createRadialGradient(-r*.35,-r*.35,r*.1,0,0,r);g.addColorStop(0,'#8a93a6');g.addColorStop(.55,'#3a4152');g.addColorStop(1,'#1b1e26');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='rgba(0,0,0,.7)';[[-.25,-.3],[.15,-.38],[-.02,-.08]].forEach(([a,b])=>{ctx.beginPath();ctx.arc(a*r,b*r,r*.11,0,7);ctx.fill()});ctx.restore()};
 const bahn=()=>{ctx.fillStyle='rgba(255,255,255,.05)';ctx.fillRect(bahnL,0,bahnR-bahnL,H);ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(bahnL-sz*.35,0,sz*.35,H);ctx.fillRect(bahnR,0,sz*.35,H);
  ctx.strokeStyle='rgba(255,255,255,.12)';ctx.setLineDash([4,10]);ctx.beginPath();ctx.moveTo(cx,cy+dy*3);ctx.lineTo(cx,H);ctx.stroke();ctx.setLineDash([])};
 let phase='warten',t0=0,erg=null,ziel=null,konf=[],raf=0,last=performance.now();
 const zeichnen=now=>{const dt=Math.min(.05,(now-last)/1000);last=now;ctx.clearRect(0,0,W,H);bahn();
  if(phase==='rollt'){const p=Math.min(1,(now-t0)/950),e=1-Math.pow(1-p,1.6);ball.y=startY-(startY-ziel.y)*e;ball.x=cx+(ziel.x-cx)*Math.pow(p,1.3);ball.r=sz*(.3-.1*e);
   if(erg.typ==='pudel')pins.forEach(k=>{if(Math.abs(k.y-ball.y)<sz*.6)k.wob+=dt*14});
   if(p>=1){phase='fallen';t0=now;treffen()}}
  else if(phase==='fallen'||phase==='fertig'){ball.y-=dt*sz*4;ball.r*=.99;
   pins.forEach(k=>{if(k.fall){k.vy+=sz*12*dt;k.x+=k.vx*dt;k.y+=k.vy*dt;k.rot+=k.vr*dt;k.a=Math.max(0,k.a-dt*.7)}else if(k.wob)k.wob=Math.max(0,k.wob-dt*6)});
   if(phase==='fallen'&&now-t0>650){phase='fertig';ergebnis()}}
  pins.forEach(kegel);if(ball.y>-ball.r)kugel(ball.x,ball.y,ball.r,(startY-ball.y)/(ball.r||1));
  konf.forEach(k=>{k.vy+=200*dt;k.x+=k.vx*dt;k.y+=k.vy*dt;k.rot+=k.vr*dt;ctx.save();ctx.translate(k.x,k.y);ctx.rotate(k.rot);ctx.fillStyle=k.c;ctx.fillRect(-k.s/2,-k.s/4,k.s,k.s/2);ctx.restore()});konf=konf.filter(k=>k.y<H+20);
  if($('#mini'))raf=requestAnimationFrame(zeichnen)};
 function treffen(){if(erg.typ==='pudel')return;
  let liste=[...pins];if(erg.typ==='kranz')liste=pins.filter(k=>!k.koenig);
  else if(erg.typ==='holz')liste=[...pins].sort((a,b)=>(Math.abs(a.x-ziel.x)/dx+a.front*.55)-(Math.abs(b.x-ziel.x)/dx+b.front*.55)).slice(0,erg.holz);

async function fotoVerkleinern(file){const img=await bildLaden(file),f=Math.min(1,FOTO_PX/Math.max(img.width,img.height));

 let q=.6,url=cv.toDataURL('image/jpeg',q);while(url.length>110000&&q>.3){q-=.1;url=cv.toDataURL('image/jpeg',q)}
 const b64=url.split(',')[1];return{url,b64,bytes:Math.round(b64.length*3/4)}}

  r=await fetch(ghApi('git/refs'),{method:'POST',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify({ref:'refs/heads/'+FOTO_BR,sha})});if(!r.ok&&r.status!==422)throw await apiErr(r)}

const APP_URL=()=>location.origin+location.pathname;
const icsEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
function icsFold(line){const enc=new TextEncoder(),out=[];let cur='',len=0;for(const ch of line){const b=enc.encode(ch).length;if(len+b>73){out.push(cur);cur=' ';len=1}cur+=ch;len+=b}out.push(cur);return out.join('\r\n')}
function icsKalender(termine){const now=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Schwelmer Kegeltreff//App//DE','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Schwelmer Kegeltreff',
  'BEGIN:VTIMEZONE','TZID:Europe/Berlin','BEGIN:DAYLIGHT','TZOFFSETFROM:+0100','TZOFFSETTO:+0200','TZNAME:CEST','DTSTART:19700329T020000','RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU','END:DAYLIGHT',
  'BEGIN:STANDARD','TZOFFSETFROM:+0200','TZOFFSETTO:+0100','TZNAME:CET','DTSTART:19701025T030000','RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU','END:STANDARD','END:VTIMEZONE'];
 for(const t of termine){const d=t.datum.replace(/-/g,''),[hh,mm]=(t.uhrzeit||(isKegeln(t)?'18:00':'19:00')).split(':'),eh=String(Math.min(23,+hh+5)).padStart(2,'0');
  L.push('BEGIN:VEVENT',`UID:kegeltreff-${t.id}@schwelmer-kegeltreff`,`DTSTAMP:${now}`,`DTSTART;TZID=Europe/Berlin:${d}T${hh}${mm}00`,`DTEND;TZID=Europe/Berlin:${d}T${eh}${mm}00`,
   `SUMMARY:${icsEsc((t.status==='ausgefallen'||t.status==='abgesagt'?'Fällt aus: ':'')+(isKegeln(t)?emo(t)+' Kegeln – Schwelmer Kegeltreff':emo(t)+' '+titelOf(t)+' (Kegeltreff)'))}`,`LOCATION:${icsEsc(isKegeln(t)?(S.verein.ort||'Restaurant Samos, Dahler Str. 2, 42389 Wuppertal'):(t.ort||''))}`,
   `DESCRIPTION:${icsEsc(icsDetails(t))}`,`URL:${APP_URL()}`,`STATUS:${t.status==='ausgefallen'||t.status==='abgesagt'?'CANCELLED':'CONFIRMED'}`);
  if(t.status!=='ausgefallen'&&t.status!=='abgesagt')L.push('BEGIN:VALARM','ACTION:DISPLAY',isKegeln(t)?'DESCRIPTION:Morgen ist Kegeln – Figur nicht vergessen!':'DESCRIPTION:Morgen: '+icsEsc(titelOf(t)),'TRIGGER:-P1D','END:VALARM');
  L.push('END:VEVENT')}
 L.push('END:VCALENDAR');return L.map(icsFold).join('\r\n')+'\r\n'}

function icsDetails(t){const z=t.zusagen||{},L=[];
 if(isKegeln(t))L.push('🎳 Kegelabend – Schwelmer Kegeltreff');else L.push(emo(t)+' '+titelOf(t));
 L.push('🕖 '+fmtD(t.datum)+', '+(t.uhrzeit||(isKegeln(t)?'18:00':'19:00'))+' Uhr');
 const ort=isKegeln(t)?(S.verein.ort||'Restaurant Samos'):(t.ort||'');if(ort)L.push('📍 '+ort);
 if(t.bemerkung)L.push('📝 '+t.bemerkung);
 const n=s=>Object.entries(z).filter(([,v])=>v.status===s).map(([k])=>M(k)?.spitzname||k);
 const ja=n('ja'),vl=n('vl');if(ja.length)L.push('','✓ Dabei ('+ja.length+'): '+ja.join(', '));if(vl.length)L.push('? Unsicher: '+vl.join(', '));
 const fahrer=Object.entries(z).filter(([,v])=>v.status==='ja'&&v.anreise==='selbst').map(([k,v])=>{const mit=Object.entries(z).filter(([,w])=>w.mit===k).map(([j])=>M(j)?.spitzname||j);return(M(k)?.spitzname||k)+(v.plaetze?' ('+v.plaetze+' frei)':'')+(mit.length?' mit '+mit.join(', '):'')});
 if(fahrer.length)L.push('🚗 Fahrer: '+fahrer.join(' · '));
 L.push('','Stand: '+new Date().toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'})+' – Zu- und Absage in der App:',APP_URL());return L.join('\n')}
const istIOS=()=>/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const istAndroid=()=>/Android/i.test(navigator.userAgent);
const b64url=txt=>{const b=new TextEncoder().encode(txt);let s='';for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
function icsLaden(termine,name){const txt=icsKalender(termine),kurz=name.replace(/\.ics$/,'');
 // iPhone/iPad: über den Offline-Speicher als echte .ics-Adresse öffnen → Kalender-Dialog „Hinzufügen“

function mischen(a){a=[...a];for(let i=a.length-1;i>0;i--){const r=new Uint32Array(1);crypto.getRandomValues(r);const j=r[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
act.auslosen=tid=>{if(S.spielCache[tid]?.sitz)return toast('Die Sitzordnung steht schon fest');
 const pres=(S.abend?.id===tid?S.abend.spieler:[]).filter(p=>p.anwesend).map(p=>({id:p.id,name:p.name}));if(pres.length<2)return toast('Erst die Anwesenden abhaken');
 ask(`Sitzordnung für ${pres.length} Anwesende auslosen? Danach steht sie für den Abend fest.`,'🎲 Auslosen',()=>{
  const m=mischen(pres),half=Math.ceil(m.length/2),extraTafel=crypto.getRandomValues(new Uint8Array(1))[0]%2===0;
  const a=m.slice(0,m.length%2&&!extraTafel?half-1:half),b=m.slice(a.length),sitz={tafel:a,tuer:b,ts:new Date().toISOString(),von:S.me};

 const rest=S.spielCache[tid]?.sitz?[]:recSpieler(tid).map(p=>p.id).filter(id=>!S.rec.teams.tafel.includes(id)&&!S.rec.teams.tuer.includes(id));rest.forEach((id,i)=>S.rec.teams[i%2?'tuer':'tafel'].push(id));recSheet()};
function verliererVon(R,tid){if(R.typ==='team')return R.sieger?(R.teams?.[R.sieger==='tafel'?'tuer':'tafel']||[]):[];

function teilnehmerVon(R,tid){if(R.typ==='team'){const l=verliererVon(R,tid);return[...l,...[...(R.teams?.tafel||[]),...(R.teams?.tuer||[])].filter(id=>!l.includes(id))]}

function strafText(g){if(g.strafen!==false)return g.typ==='einzel'?'Platz 2+: je 0,10 € pro Platz':'Verlierer je 1 €';const m=g.manuell;if(!m)return'ohne Strafen';

 return m.modus==='pro'?`${eur(num(m.betrag))} je Verlierer`:`${eur(num(m.betrag))} für die Verlierer, aufgeteilt`}

function gastKonto(){const items=[{datum:S.verein.startSaldoStichtag,text:'Übertrag Gäste aus Excel',betrag:num(S.kasse.gaesteStart)}];
 for(const t of termineSorted())if(t.status==='abgeschlossen'&&!t.inStartSaldo)for(const g of t.gaeste||[])items.push({datum:t.datum,text:'Gast '+g.name,betrag:g.betrag});
 for(const b of S.kasse.buchungen.filter(b=>b.mitglied==='gast'))items.push({datum:b.datum,text:(b.art==='einzahlung'?'Einzahlung':b.art==='gutschrift'?'Gutschrift':'Belastung')+(b.text?': '+b.text:''),betrag:(b.art==='belastung'?1:-1)*num(b.betrag),bid:b.id});
 items.sort((a,b)=>a.datum.localeCompare(b.datum));return{saldo:r2(items.reduce((a,i)=>a+i.betrag,0)),items}}
function samstage(von,bis){const r=[];let d=von;while(new Date(d+'T12:00:00Z').getUTCDay()!==6)d=addDays(d,1);for(;d<=bis;d=addDays(d,7))r.push(d);return r}
function terminSummen(){const m={...(S.hist?.terminBetraege||Object.fromEntries((S.hist?.abende||[]).filter(a=>a.strafen).map(a=>[a.datum,{...a.strafen}])))},h=todayISO();
 for(const t of kegelTermine()){if(m[t.datum])continue;
  if(t.status==='abgeschlossen'&&t.strafen){const x={...t.strafen};(t.gaeste||[]).forEach(g=>x.gast=r2((x.gast||0)+(g.strafe||0)));m[t.datum]=x}
  else if(t.status==='ausgefallen'&&t.datum<=h){const x={};aktive().filter(q=>(q.eintritt||'')<=t.datum).forEach(q=>x[q.id]=S.verein.pauschaleAusfall??15);m[t.datum]=x}}
 return m}

 if(S.nutzung===undefined&&!S.nutzLaden){S.nutzLaden=true;afterHooks.push(()=>Store.get('nutzung.json').then(r=>{S.nutzung=r.data||{personen:{}}}).catch(()=>{S.nutzung={personen:{}}}).finally(()=>{S.nutzLaden=false;rerender()}))}
 const P=S.nutzung?.personen||{},akt=aktive(),dabei=akt.filter(m=>P[m.id]),fehlt=akt.filter(m=>!P[m.id]);
 const wann=iso=>{const t=(Date.now()-new Date(iso))/864e5;return t<1/24?'gerade eben':t<1?'heute':t<2?'gestern':t<14?'vor '+Math.floor(t)+' Tagen':fmtD(iso.slice(0,10))};
 return`<div class="card"><details ${S.nutzOpen?'open':''} ontoggle="S.nutzOpen=this.open"><summary><span>📲 Wer nutzt die App?</span><span class="pill">${dabei.length} von ${akt.length}</span></summary>
  ${S.nutzung===undefined?'<p class="muted small">Lade …</p>':`<div style="margin:12px 0 4px;height:8px;border-radius:99px;background:var(--chip);overflow:hidden"><div style="height:100%;border-radius:99px;background:var(--gelb3);width:${akt.length?Math.round(dabei.length/akt.length*100):0}%"></div></div>
  <ul class="l">${dabei.sort((a,b)=>(P[b.id].zuletzt||'').localeCompare(P[a.id].zuletzt||'')).map(m=>{const p=P[m.id];return`<li><span class="av">${esc(ini(m.spitzname))}</span><div class="g"><b>${esc(m.spitzname)}</b><div class="muted small">zuletzt ${wann(p.zuletzt)} · seit ${fmtD(p.erst.slice(0,10))} · ${esc(p.geraet||'')}${p.version?' · v'+esc(p.version):''}</div></div></li>`}).join('')}</ul>
  ${fehlt.length?`<div class="sec" style="margin-top:10px">Noch nicht dabei (${fehlt.length})</div><div class="chips wrap">${fehlt.map(m=>`<span class="chip">${esc(m.spitzname)}</span>`).join('')}</div><p class="muted small">Tipp: Den Einladungslink (unten bei „Zugang“) nochmal in die WhatsApp-Gruppe schicken.</p>`:'<p class="muted small">Alle aktiven Mitglieder sind dabei 🎉</p>'}
  <p class="muted small" style="margin-bottom:0">Erfasst wird, wer die App mit dem Einladungslink geöffnet und sich ausgewählt hat – ab Version 1.2.0. Wer sie seitdem noch nicht geöffnet hat, erscheint erst danach.</p>`}</details></div>`}
function kontakteOffen(){const EX=S.exK?.personen||{},K=S.kontakte?.personen||{};let n=0,p=0;
 for(const[id,e]of Object.entries(EX)){if(!M(id))continue;const f=Object.keys(e).filter(k=>e[k]&&!K[id]?.[k]).length;if(f){n+=f;p++}}return{n,p}}
function kontakteImportBanner(){
 if(S.exK===undefined&&!S.exKLaden){S.exKLaden=true;afterHooks.push(()=>Store.get('excel-kontakte.json').then(r=>{S.exK=r.data||null}).catch(()=>{S.exK=null}).finally(()=>{S.exKLaden=false;rerender()}))}
 if(!S.exK)return'';const o=kontakteOffen();if(!o.n)return'';
 return`<div class="banner">📥 Kontaktdaten aus der Excel gefunden: <b>${o.p} Personen</b> mit ${o.n} noch leeren Feldern (Telefon, E-Mail, Adresse, Geburtstag).<br><span class="small">Es werden nur leere Felder gefüllt – was jemand selbst eingetragen hat, bleibt.</span><button class="btn p w" style="margin-top:8px" onclick="act.kontakteImport()">Kontaktdaten übernehmen</button></div>`}
act.kontakteImport=()=>{const o=kontakteOffen();ask(`${o.n} Felder bei ${o.p} Personen aus der Excel übernehmen?`,'Übernehmen',async()=>{
 const EX=S.exK.personen;try{S.kontakte=await save('kontakte.json',d=>{d.personen=d.personen||{};for(const[id,e]of Object.entries(EX)){if(!M(id))continue;const k=d.personen[id]=d.personen[id]||{};for(const[f,v]of Object.entries(e))if(v&&!k[f])k[f]=v}return d},'Kontaktdaten aus Excel übernommen',{personen:{}})}catch(e){return toast('⚠ '+e.message,5000)}
 rerender();toast('✓ Kontaktdaten übernommen')})};

 ${Store.isDemo()?'':`<div class="card"><h3>🔗 Einladungslink</h3><p class="muted small">Enthält den Zugangsschlüssel – nur privat in der WhatsApp-Gruppe teilen. Wer ihn öffnet, ist sofort verbunden.</p><button class="btn p w" onclick="act.invite()">Link erzeugen & kopieren</button></div>`}`}

/* ---------- Darstellung: Stil × Farbwelt (pro Gerät) ---------- */
const STILE={auto:{name:'Automatisch',sub:'hell oder dunkel wie das Handy'},vereinsheim:{name:'Vereinsheim',sub:'hell & ruhig'},flutlicht:{name:'Flutlicht',sub:'dunkel & sportlich'},anzeigetafel:{name:'Anzeigetafel',sub:'groß & plakativ'}};
const FARBEN={sg:{name:'Vereinsfarben',sub:'Schwarz-Gelb'},bvb:{name:'Schwarz-Gelb',sub:'mit BVB-Sprüchen'},rw:{name:'Rot-Weiß',sub:'mit Bayern-Sprüchen'}};
const SCHRIFT={vereinsheim:'Plus+Jakarta+Sans:wght@400;600;700;800',flutlicht:'Space+Grotesk:wght@500;700',anzeigetafel:'Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700;800'};
(()=>{const alt=lsGet('kt_theme');if(alt&&!lsGet('kt_stil')){const m={light:['vereinsheim','sg'],dark:['flutlicht','sg'],bvb:['vereinsheim','bvb'],fcb:['vereinsheim','rw'],auto:['auto','sg']}[alt]||['auto','sg'];lsSet('kt_stil',m[0]);lsSet('kt_farbe',m[1])}})();
const stilWahl=()=>STILE[lsGet('kt_stil')]?lsGet('kt_stil'):'auto';
const stilAktiv=()=>{const t=stilWahl();return t==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'flutlicht':'vereinsheim'):t};
const farbeWahl=()=>FARBEN[lsGet('kt_farbe')]?lsGet('kt_farbe'):'sg';
const themeWahl=stilWahl;
const themeAktiv=()=>({bvb:'bvb',rw:'fcb'})[farbeWahl()]||'light';
function applyTheme(){const st=stilAktiv(),fa=farbeWahl(),de=document.documentElement;de.dataset.stil=st;de.dataset.farbe=fa==='rw'?'rw':'sg';delete de.dataset.theme;
 let l=document.getElementById('kt-font');if(!l){l=document.createElement('link');l.id='kt-font';l.rel='stylesheet';document.head.appendChild(l)}
 const href=SCHRIFT[st]?'https://fonts.googleapis.com/css2?family='+SCHRIFT[st]+'&display=swap':'';if(href&&l.getAttribute('href')!==href)l.href=href;
 const m=document.querySelector('meta[name=theme-color]');if(m)m.content=st==='vereinsheim'?'#F3F4F6':st==='flutlicht'?'#0E0F12':fa==='rw'?'#0E2240':'#0A0A0A'}
function slogan(){const sp=THEMES[themeAktiv()]?.sprueche;if(!sp)return'';const d=new Date(),doy=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);return sp[doy%sp.length]}
const neuZeichnen=()=>{applyTheme();if($('#app header'))shellBleib()};
act.stil=k=>{lsSet('kt_stil',k);neuZeichnen();toast(STILE[k].name)};
act.farbe=k=>{lsSet('kt_farbe',k);neuZeichnen();toast(FARBEN[k].name)};
act.hellDunkel=()=>{lsSet('kt_stil',stilAktiv()==='flutlicht'?'vereinsheim':'flutlicht');neuZeichnen()};
act.theme=act.stil;
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(stilWahl()==='auto')neuZeichnen()})}catch(_){}
applyTheme();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});

async function boot(){
 const h=location.hash;
 let m=h.match(/#k=([^&]+)/);if(m){Store.cfg={mode:'github',token:decodeURIComponent(m[1])};lsSet('kt_cfg',JSON.stringify(Store.cfg));history.replaceState(null,'',location.pathname)}
 m=h.match(/#s=([^&]+)/);if(m){try{const j=JSON.parse(atob(decodeURIComponent(m[1])));Store.cfg={mode:'github',token:j.t};lsSet('kt_cfg',JSON.stringify(Store.cfg))}catch(_){}history.replaceState(null,'',location.pathname)}
 if(!Store.cfg)return vSetup();
 $('#app').innerHTML='<div class="setup"><img src="logo.png" alt=""><p class="muted">Lade Vereinsdaten…</p></div>';
 try{await loadAll()}catch(e){if(Store.isDemo()){try{localStorage.clear()}catch(_){}return vSetup()}return vSetup(e.message)}
 if(!S.me||!M(S.me))return vWer();
 shell();render();
 if(/[?&]u=/.test(location.search)){history.replaceState(null,'',location.pathname);setTimeout(()=>toast('✓ Aktualisiert auf '+APP_VERSION+(APP_NEU?' – '+APP_NEU:''),5000),400)}
 setTimeout(()=>updatePruefen(true),2500);setTimeout(nutzungMelden,4000);
 if(!lsGet('kt_tour'))setTimeout(()=>rundgang(0),600);
 miniLaden();miniBeimStart();
 {const g=new URLSearchParams(location.search).get('go');if(g){history.replaceState(null,'',location.pathname);setTimeout(()=>gehe(g),50)}}badgeWeg();
 if(pushKann()&&Notification.permission==='granted')setTimeout(pushPruefen,5000);
}
act.updateSuchen=async()=>{toast('Suche nach Updates …');const e=await updatePruefen(true);
 if(e==='neu'){appTop(1);toast('✨ Version '+UPD.neu.v+' ist da – oben auf „Jetzt aktualisieren“ tippen',5000)}
 else if(e==='aktuell')toast('✓ Du hast die neueste Version ('+APP_VERSION+')',3500);
 else if(e==='offline')toast('📴 Gerade kein Netz – bitte später nochmal',3500);
 else toast('⚠ Prüfung gerade nicht möglich – bitte gleich nochmal',3500)};
/* Aktualisieren: offene Eingaben hochladen, dann den Offline-Speicher der alten Version komplett leeren,
   damit die neue Seite garantiert frisch aus dem Netz kommt. Der Offline-Speicher baut sich danach von selbst neu auf.
   Strichliste & Warteschlange liegen im localStorage und bleiben dabei erhalten. */
act.updaten=async()=>{if(!navigator.onLine)return toast('📴 Gerade kein Netz – bitte gleich nochmal tippen',4000);
 toast('Aktualisiere …');try{await flushOutbox();if(lsGet('kt_abend_dirty'))await speichereAbend()}catch(_){}
 /* Mit Mitteilungs-Abo den Service Worker nur erneuern – Abmelden würde das Abo löschen */
 try{const regs=await navigator.serviceWorker?.getRegistrations()||[];await Promise.all(regs.map(async r=>{const sub=await r.pushManager?.getSubscription().catch(()=>null);if(sub){await r.update().catch(()=>{});r.waiting?.postMessage('skipWaiting')}else await r.unregister()}))}catch(_){}
 try{const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('kegeltreff-app')).map(k=>caches.delete(k)))}catch(_){}
 location.replace(location.pathname+'?u='+encodeURIComponent(UPD.neu?.v||Date.now()))};
setInterval(()=>updatePruefen(true),600000);
window.addEventListener('online',()=>updatePruefen(true));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')badgeWeg();if(document.visibilityState==='hidden'){flushTermine();if(saveTimer)speichereAbend();return}
 updatePruefen();
 if(S.verein&&Date.now()-S.loadedAt>60000&&!saveTimer&&!OUT.list.length&&!OUT.busy&&!$('#sheet'))loadAll().then(rerender).catch(()=>{})});
window.addEventListener('pagehide',()=>{flushTermine();if(saveTimer)speichereAbend()});
window.addEventListener('beforeunload',e=>{if(saveTimer||OUT.list.length){flushTermine();if(saveTimer)speichereAbend();e.preventDefault()}});
/* Sicherheitsnetz: diese Aktionen laufen nur mit entsperrtem Admin-Bereich */
['abendReset','abendResetGo','bLoeschen','buchen','ausgabe','excelStand','kAdd','kDel','kEdit','kSet','kStd','strafe','teuerGrenze','mEdit','mSave','terminNeu','serie','ausfall','tStatus','tLoeschen','karteImport','invite','kontakteImport','invDel','sitzReset','fuerAndere']
 .forEach(k=>{const f=act[k];if(f)act[k]=(...a)=>isAdmin()?f(...a):act.adminLogin(()=>act[k](...a))});
boot();
